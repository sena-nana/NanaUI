[package]
name = "vue-quickjs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Phase 2 QuickJS-only Vue runtime-core probe (mutually exclusive with vue-v8)"

[[bin]]
name = "vue-quickjs"
path = "src/main.rs"

[features]
default = ["engine-quickjs"]
# Application-level backend choice sample (Iced / Vue+QuickJS / Vue+V8).
# This example only enables QuickJS; do not depend on nana-js-v8 / engine-v8 here.
engine-quickjs = []
ui-vue-quickjs = ["engine-quickjs"]
# Declared only so `refuse_dual_js_engines!` can refuse accidental dual enablement.
engine-v8 = []

[dependencies]
nana-js-engine.workspace = true
nana-js-quickjs.workspace = true
nana-ui-vue.workspace = true
serde_json.workspace = true

[package]
name = "nana-tauri-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Generic NanaUI host that loads a Tauri project's frontend bundle (no WebView, no Blitz)"

[[bin]]
name = "nana-tauri-demo"
path = "src/main.rs"

[features]
default = ["engine-quickjs", "windowed"]
engine-quickjs = ["dep:nana-js-quickjs"]
engine-v8 = ["dep:nana-js-v8", "nana-js-v8/engine"]
# NanaUI hosted window — Primary draws MessageBridge → Nana widgets.
windowed = [
    "dep:nana-ui",
    "nana-ui/hosted",
    "nana-ui/bundled-fonts",
    "nana-ui/controls",
    "dep:iced",
    "nana-ui-vue/iced-view",
]
# Headless JS / layout probe (no window paint).
headless-js = []
# Offscreen iced_wgpu PNG capture for same-session QJS↔V8 evidence.
evidence-png = [
    "windowed",
    "dep:iced_wgpu",
    "dep:iced_winit",
    "dep:png",
]

[dependencies]
nana-js-engine.workspace = true
nana-ui-vue = { path = "../../crates/nana-ui-vue", default-features = false }
nana-ui-web-api.workspace = true
nana-js-quickjs = { workspace = true, optional = true }
nana-js-v8 = { workspace = true, optional = true }
nana-ui = { path = "../../crates/nana-ui", optional = true, default-features = false }
iced = { workspace = true, optional = true }
iced_wgpu = { workspace = true, optional = true }
iced_winit = { workspace = true, optional = true }
png = { version = "0.18.1", optional = true }
serde_json.workspace = true

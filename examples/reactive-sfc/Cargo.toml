[package]
name = "reactive-sfc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Views written as .vue files with Rust scripts, compiled by nana-ui-sfc in build.rs"

[lib]
name = "reactive_sfc"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "reactive-sfc"
path = "src/main.rs"
test = false

[[bin]]
name = "sfc-benchmark"
path = "src/bin/sfc-benchmark.rs"
test = false

[dependencies]
nana-ui = { path = "../../crates/nana-ui", default-features = false, features = ["hosted", "bundled-fonts", "view-macro", "wgpu-backends"] }
nana-ui-platform.workspace = true

[build-dependencies]
nana-ui-sfc = { path = "../../crates/nana-ui-sfc" }

[dev-dependencies]
nana-ui-sfc = { path = "../../crates/nana-ui-sfc" }

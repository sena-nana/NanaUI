[package]
name = "runtime-host-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "runtime_host_fixture"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "runtime-host-fixture"
path = "src/main.rs"
test = false

[build-dependencies]
nana-app-icon = { workspace = true, features = ["embed"] }

[dependencies]
nana-ui = { workspace = true, features = ["hosted", "wgpu-interop"] }
nana-ui-platform.workspace = true
wgpu.workspace = true

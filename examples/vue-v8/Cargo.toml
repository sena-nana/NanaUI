[package]
name = "vue-v8"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "V8 Vue runtime-core probe"

[[bin]]
name = "vue-v8"
path = "src/main.rs"

[features]
default = ["engine", "engine-v8"]
# Links crates.io v8 150.4.0.
engine = ["nana-js-v8/engine"]
engine-v8 = ["engine"]
ui-vue-v8 = ["engine-v8"]

[dependencies]
nana-js-engine.workspace = true
nana-js-v8 = { workspace = true, features = ["engine"] }
nana-ui-vue.workspace = true
serde_json.workspace = true

[package]
name = "component-gallery"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "component-gallery"

[build-dependencies]
nana-app-icon = { workspace = true, features = ["embed"] }

[lib]
name = "component_gallery"
path = "src/lib.rs"

[features]
default = ["bundled-fonts"]
bundled-fonts = ["nana-ui/bundled-fonts"]
benchmark = [
    "bundled-fonts",
    "dep:pollster",
    "dep:serde",
    "dep:serde_json",
    "dep:wgpu",
]
snapshots = [
    "bundled-fonts",
    "nana-ui/gpu",
    "nana-ui/hosted",
    "nana-ui/syntax-highlighting",
    "dep:nana-ui-core",
    "dep:nana-ui-devtools",
    "dep:nana-ui-scene",
    "dep:pollster",
    "dep:wgpu",
]

[dependencies]
nana-ui = {
    path = "../../crates/nana-ui",
    default-features = false,
    features = ["components", "gpu", "hosted"],
}
nana-ui-core = { workspace = true, optional = true }
nana-ui-devtools = { workspace = true, optional = true, features = ["offscreen"] }
nana-ui-platform.workspace = true
nana-ui-scene = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
wgpu = { workspace = true, optional = true }

[[bin]]
name = "component-gallery"
path = "src/main.rs"
required-features = ["bundled-fonts"]

[[bin]]
name = "ui-benchmark"
path = "src/bin/ui-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "ui-snapshots"
path = "src/bin/ui-snapshots.rs"
required-features = ["snapshots"]

[[bin]]
name = "ui-migration-ab"
path = "src/bin/ui-migration-ab.rs"
required-features = ["snapshots"]

[[bin]]
name = "ui-host-ab"
path = "src/bin/ui-host-ab.rs"
required-features = ["snapshots"]

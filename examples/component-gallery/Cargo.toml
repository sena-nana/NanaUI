[package]
name = "component-gallery"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "component-gallery"

[lib]
name = "component_gallery"
path = "src/lib.rs"

[features]
default = ["bundled-fonts"]
bundled-fonts = ["nana-ui/bundled-fonts"]
benchmark = [
    "bundled-fonts",
    "dep:iced_wgpu",
    "dep:iced_winit",
    "dep:serde",
    "dep:serde_json",
]
live2d-acceptance = [
    "benchmark",
    "nana-ui/gpu",
    "dep:glam",
    "dep:live2d-core",
    "dep:live2d-test-support",
    "dep:live2d-wgpu",
    "dep:png",
]
snapshots = [
    "bundled-fonts",
    "nana-ui/gpu",
    "dep:iced_wgpu",
    "dep:iced_winit",
    "dep:nana-ui-core",
    "dep:nana-ui-scene",
    "dep:png",
]

[dependencies]
iced.workspace = true
iced_wgpu = { workspace = true, optional = true }
iced_winit = { workspace = true, optional = true }
glam = { version = "0.33.3", optional = true }
live2d-core = { git = "https://github.com/sena-nana/live2d-rs.git", rev = "71e92d04ab1b377aae6dac66d6f1ec5f9bb6d033", optional = true }
live2d-test-support = { git = "https://github.com/sena-nana/live2d-rs.git", rev = "71e92d04ab1b377aae6dac66d6f1ec5f9bb6d033", optional = true }
live2d-wgpu = { git = "https://github.com/sena-nana/live2d-rs.git", rev = "71e92d04ab1b377aae6dac66d6f1ec5f9bb6d033", optional = true, default-features = false }
nana-ui = {
    path = "../../crates/nana-ui",
    default-features = false,
    features = ["components"],
}
nana-ui-core = { workspace = true, optional = true }
nana-ui-scene = { workspace = true, optional = true }
png = { version = "0.18.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[[bin]]
name = "component-gallery"
path = "src/main.rs"
required-features = ["bundled-fonts"]

[[bin]]
name = "ui-benchmark"
path = "src/bin/ui-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "ui-snapshots"
path = "src/bin/ui-snapshots.rs"
required-features = ["snapshots"]

[[bin]]
name = "ui-live2d-acceptance"
path = "src/bin/ui-live2d-acceptance.rs"
required-features = ["live2d-acceptance"]

[package]
name = "gpui-scenario-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Issue #12 same-Scenario GPUI adapter. Reads perf/scenarios JSON; does not depend on nana-* crates."

[dependencies]
gpui = { version = "0.2.2", features = ["test-support", "runtime_shaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "nana-mobile-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Experimental platform-neutral core shared by the NanaUI iOS and Android hosts"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_mobile_host"
path = "src/lib.rs"

[dependencies]
nana-ui-core.workspace = true
nana-ui-platform.workspace = true
nana-ui = { path = "../../crates/nana-ui", default-features = false, features = [
    "gpu",
    "accesskit-tree",
    # The host owns its surface and device.
    "wgpu-interop",
    "wgpu-backends",
] }
wgpu.workspace = true
pollster.workspace = true

plugins {
    id 'com.android.application' version '8.7.2' apply true
}

android {
    namespace 'app.nanaui.host'
    compileSdk 34

    defaultConfig {
        applicationId 'app.nanaui.host'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Align games-activity's kotlin-stdlib-jdk8 1.6 with appcompat's stdlib 1.8 (duplicate classes).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // GameActivity Java + GameTextInput. Do not enable prefab: android-activity
    // already compiles its own native glue.
    implementation 'androidx.games:games-activity:4.4.0'
}

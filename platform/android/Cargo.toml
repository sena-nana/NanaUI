[package]
name = "nana-android-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Experimental Android ARM64 GameActivity host over nana-mobile-host (not a product paint kernel)"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_android_host"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Experimental NanaUI Runtime slot. Not a product UI target.
experimental-android = []

[dependencies]
nana-mobile-host = { path = "../mobile-core" }
nana-mobile-probe = { path = "../mobile-probe" }
nana-ui-core.workspace = true
nana-ui-platform = { workspace = true, features = ["experimental-android"] }
nana-ui = { path = "../../crates/nana-ui", default-features = false, features = [
    "gpu",
    "accesskit-tree",
    # This host owns its surface and device, and records its own chrome.
    "wgpu-interop",
    "wgpu-backends",
] }
wgpu.workspace = true
log = "0.4"
pollster.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = "0.15"
accesskit.workspace = true
accesskit_android = { workspace = true, features = ["embedded-dex"] }

[package.metadata.android]
package = "app.nanaui.host"
apk_name = "nana-android-host"
# GameActivity loads libnana_android_host.so and calls android_main.
app_name = "NanaUI"
# Keep min SDK aligned with NDK API 24 linker.
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false

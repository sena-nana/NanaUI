    <rect x="860" y="414" width="256" height="28" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-dasharray="4 3"/>
    <text x="988" y="432" text-anchor="middle" fill="#CBD5E1">nana-icons-tabler (独立包)</text>

    <!-- L1 -->
    <rect x="36" y="458" width="1096" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="52" y="484" fill="#94A3B8" font-weight="700">L1</text>
    <text x="86" y="484" fill="#64748B" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">合同</text>
    <rect x="160" y="466" width="956" height="28" rx="6" fill="#1D3E78" stroke="#64ACE8" stroke-width="1.3"/>
    <text x="638" y="484" text-anchor="middle" fill="#E0F2FE" font-weight="700">nana-ui-core (Style Model · OKLCH · 主题 · 几何 · WorkspaceModel · Motion IR)</text>

    <!-- L0 -->
    <rect x="36" y="510" width="1096" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07"/>

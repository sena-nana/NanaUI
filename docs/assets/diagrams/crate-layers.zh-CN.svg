    <text x="247" y="536" text-anchor="middle" fill="#FED7AA">nana-diagnostics</text>
    <rect x="346" y="518" width="168" height="28" rx="6" fill="#3B2435" stroke="#FF8A5C" stroke-opacity="0.65"/>

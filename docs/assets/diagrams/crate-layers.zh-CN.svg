<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="NanaUI 工作区依赖分层 — 25 个 Crate，58 条无环普通依赖边">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C172E"/>
      <stop offset="0.55" stop-color="#112244"/>
      <stop offset="1" stop-color="#152D58"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="downArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#64ACE8"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="36" y="35" fill="#F8FAFC" font-size="20" font-weight="700">工作区依赖分层 — 25 个 Crate，58 条严格无环普通依赖边</text>
    <text x="36" y="55" fill="#94A3B8" font-size="12.5">24 个工作区成员 + 独立 nana-icons-tabler · 每条非 optional 普通依赖均严格指向更低层级（L_dep &lt; L_pkg）</text>
  </g>

  <!-- Legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="11.5">
    <rect x="36" y="68" width="12" height="12" rx="3" fill="#1D3E78" stroke="#64ACE8"/>
    <text x="54" y="78" fill="#CBD5E1">核心界面主线</text>
    <rect x="158" y="68" width="12" height="12" rx="3" fill="#143A4A" stroke="#54C79B"/>
    <text x="176" y="78" fill="#CBD5E1">唯一权威引擎与合同</text>
    <rect x="322" y="68" width="12" height="12" rx="3" fill="#292252" stroke="#B78BFA"/>
    <text x="340" y="78" fill="#CBD5E1">声明式作者工具链</text>
    <rect x="478" y="68" width="12" height="12" rx="3" fill="#3B2435" stroke="#FF8A5C"/>
    <text x="496" y="78" fill="#CBD5E1">宿主、资产、打包与开发工具</text>
    <rect x="688" y="68" width="12" height="12" rx="3" fill="#1E293B" stroke="#94A3B8"/>
    <text x="706" y="78" fill="#CBD5E1">Fork / 独立包</text>
  </g>

  <!-- Right-side Flow Guide -->
  <g>
    <line x1="1152" y1="110" x2="1152" y2="564" stroke="#64ACE8" stroke-width="2" marker-end="url(#downArrow)"/>
    <text x="1168" y="340" text-anchor="middle" transform="rotate(90 1168 340)" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="12" font-weight="600">普通依赖严格向下单向流动（无环）</text>
  </g>

  <!-- Layer Rows -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <!-- L8 -->
    <rect x="36" y="94" width="1096" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="52" y="120" fill="#94A3B8" font-weight="700">L8</text>
    <text x="86" y="120" fill="#64748B" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">工具</text>
    <rect x="160" y="102" width="236" height="28" rx="6" fill="#3B2435" stroke="#FF8A5C" stroke-opacity="0.7"/>
    <text x="278" y="120" text-anchor="middle" fill="#FED7AA">nana-ui-dev (仅 debug)</text>
    <rect x="410" y="102" width="290" height="28" rx="6" fill="#3B2435" stroke="#FF8A5C" stroke-opacity="0.7"/>
    <text x="555" y="120" text-anchor="middle" fill="#FED7AA">nana-ui-devtools (无头/Agent)</text>
    <rect x="714" y="102" width="250" height="28" rx="6" fill="#3B2435" stroke="#FF8A5C" stroke-opacity="0.7"/>
    <text x="839" y="120" text-anchor="middle" fill="#FED7AA">nana-packager (打包 CLI)</text>

    <!-- L7 -->
    <rect x="36" y="146" width="1096" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="52" y="172" fill="#94A3B8" font-weight="700">L7</text>
    <text x="86" y="172" fill="#64748B" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">门面</text>
    <rect x="160" y="154" width="956" height="28" rx="6" fill="#1D3E78" stroke="#64ACE8" stroke-width="1.4"/>
    <text x="638" y="172" text-anchor="middle" fill="#E0F2FE" font-weight="700">nana-ui (run_runtime · SceneWgpuPainter · nana_ui::runtime · ExternalSurface)</text>

    <!-- L6 -->
    <rect x="36" y="198" width="1096" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="52" y="224" fill="#94A3B8" font-weight="700">L6</text>
    <text x="86" y="224" fill="#64748B" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">场景</text>
    <rect x="160" y="206" width="956" height="28" rx="6" fill="#1D3E78" stroke="#64ACE8" stroke-width="1.2"/>
    <text x="638" y="224" text-anchor="middle" fill="#E0F2FE" font-weight="700">nana-ui-scene (UiScene · FramePlan · RuntimeDocument · 不依赖 WGPU / charts)</text>


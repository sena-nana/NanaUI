    <rect x="898" y="518" width="218" height="28" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-dasharray="4 3"/>
    <text x="1007" y="536" text-anchor="middle" fill="#CBD5E1">third_party/wgpu (fork)</text>
  </g>

  <!-- Footer Note -->
  <text x="36" y="586" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="12">
    * 仅两条 feature 门控的同层 optional 边：nana-app-icon -&gt; nana-ui-platform（runtime feature，L3）与 nana-ui-dev -&gt; nana-ui-devtools（headless feature，L8）。
  </text>
  <text x="36" y="604" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="11.5">
    只读核对命令：cargo metadata --format-version 1 --no-deps · python3 scripts/check-engine-boundary.py
  </text>
</svg>

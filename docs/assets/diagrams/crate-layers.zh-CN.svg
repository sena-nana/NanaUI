    <text x="638" y="276" text-anchor="middle" fill="#E0F2FE" font-weight="700">nana-ui-runtime (UiWorld · Flex/Grid/Inline/Layers · ComponentRegistry · Shell/Workspace/Dock)</text>

    <!-- L4 -->
    <rect x="36" y="302" width="1096" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="52" y="328" fill="#94A3B8" font-weight="700">L4</text>
    <text x="86" y="328" fill="#64748B" font-family="-apple-system, 'Noto Sans SC', sans-serif" font-size="11">宏/窗</text>
    <rect x="160" y="310" width="278" height="28" rx="6" fill="#292252" stroke="#B78BFA" stroke-opacity="0.75"/>
    <text x="299" y="328" text-anchor="middle" fill="#E9D5FF">nana-ui-view-macros (view!)</text>

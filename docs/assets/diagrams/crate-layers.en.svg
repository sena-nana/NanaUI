    <text x="54" y="78" fill="#CBD5E1">Core UI Spine</text>
    <rect x="158" y="68" width="12" height="12" rx="3" fill="#143A4A" stroke="#54C79B"/>
    <text x="176" y="78" fill="#CBD5E1">Authoritative Engines &amp; Contracts</text>
    <rect x="386" y="68" width="12" height="12" rx="3" fill="#292252" stroke="#B78BFA"/>
    <text x="404" y="78" fill="#CBD5E1">Authoring Toolchain</text>
    <rect x="536" y="68" width="12" height="12" rx="3" fill="#3B2435" stroke="#FF8A5C"/>
    <text x="554" y="78" fill="#CBD5E1">Host, Assets, Packaging &amp; Tooling</text>
    <rect x="768" y="68" width="12" height="12" rx="3" fill="#1E293B" stroke="#94A3B8"/>
    <text x="786" y="78" fill="#CBD5E1">Vendored / Standalone</text>
  </g>


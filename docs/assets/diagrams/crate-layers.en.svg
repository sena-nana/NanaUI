  <!-- Footer Note -->
  <text x="36" y="586" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
    * Only two feature-gated same-layer edges exist: nana-app-icon -&gt; nana-ui-platform (runtime feature, L3) and nana-ui-dev -&gt; nana-ui-devtools (headless feature, L8).
  </text>
  <text x="36" y="604" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">

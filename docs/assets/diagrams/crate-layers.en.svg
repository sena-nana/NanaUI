<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="NanaUI Workspace Layering — 25 Crates and 58 Acyclic Normal Edges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C172E"/>
      <stop offset="0.55" stop-color="#112244"/>
      <stop offset="1" stop-color="#152D58"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="downArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#64ACE8"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="36" y="35" fill="#F8FAFC" font-size="20" font-weight="700">Workspace Dependency Layers — 25 Crates, 58 Acyclic Normal Edges</text>
    <text x="36" y="55" fill="#94A3B8" font-size="12.5">24 workspace members + standalone nana-icons-tabler · Every non-optional normal edge satisfies L_dep &lt; L_pkg</text>
  </g>

  <!-- Legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">

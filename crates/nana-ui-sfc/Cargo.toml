[package]
name = "nana-ui-sfc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Compiles .vue view files with Rust scripts into nana-ui-runtime declarative views, from a build script"
license.workspace = true

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gui", "vue", "templates", "codegen", "nanaui"]
categories = ["gui", "development-tools"]
[dependencies]
nana-ui-view-codegen.workspace = true
prettyplease = "0.2"
# Spans of parsed text carry line and column, so errors point into the file.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json.workspace = true
serde.workspace = true
syn = { version = "2", features = ["full"] }
url.workspace = true

[[bin]]
name = "nana-sfc-remap"
path = "src/bin/nana-sfc-remap.rs"
test = false

[[bin]]
name = "nana-sfc-lsp"
path = "src/bin/nana-sfc-lsp.rs"
test = false

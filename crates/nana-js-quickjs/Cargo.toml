[package]
name = "nana-js-quickjs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "QuickJS-NG backend for NanaUI Vue (rquickjs 0.12.2 / QuickJS-NG 0.15.1)"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_js_quickjs"
path = "src/lib.rs"

[[bin]]
name = "nana-qjs-compile"
path = "src/bin/nana_qjs_compile.rs"

[dependencies]
nana-js-engine.workspace = true
nana-ui-web-api.workspace = true
# Desktop/iOS: shipped bindings. Android ARM64 has no pregenerated bindings — bindgen.
rquickjs = { workspace = true, features = ["macro"] }
serde_json.workspace = true

# aarch64-linux-android: generate QuickJS-NG FFI via bindgen (needs NDK clang + libclang).
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { workspace = true, features = ["macro", "bindgen"] }

[dev-dependencies]
# Integration tests use the shared Vue probe / Phase 3 host from nana-ui-vue.
nana-ui-vue = { path = "../nana-ui-vue", default-features = false }

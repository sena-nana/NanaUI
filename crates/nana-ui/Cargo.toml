[package]
name = "nana-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Rust-native UI foundation for the Nana application family"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui"
path = "src/lib.rs"

[features]
default = []
full = ["bundled-fonts", "components", "hosted", "syntax-highlighting"]
bundled-fonts = []
# Compatibility flags must gate real code: every entry here either maps to a
# `cfg(feature = …)` component module or pulls a runtime feature. No-op aliases
# were removed — enable `components` / `full` instead.
components = [
    "calendar",
    "charts",
    "controls",
    "graph-canvas",
    "image-viewer",
    "rich-text",
]
calendar = []
charts = []
controls = []
syntax-highlighting = [
    "controls",
    "nana-ui-runtime/syntax-highlighting",
]
graph-canvas = []
image-viewer = []
rich-text = []
gpu = ["dep:bytemuck", "dep:base64", "dep:cryoglyph", "dep:image", "dep:pollster", "dep:nana-svg-raster", "dep:ureq", "dep:url", "dep:wgpu"]
hosted = [
    "gpu",
    "dep:accesskit",
    "dep:accesskit_macos",
    "dep:accesskit_unix",
    "dep:accesskit_windows",
    "dep:android-activity",
    "dep:image",
    "dep:nana-app-icon",
    "dep:nana-window",
    "dep:raw-window-handle",
    "dep:winit",
]

[dependencies]
accesskit = { version = "0.24.1", optional = true }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
base64 = { workspace = true, optional = true }
cosmic-text = "0.19"
cryoglyph = { git = "https://github.com/sena-nana/cryoglyph.git", rev = "3fe41b131eda1288d08df89ad5ba56de97713308", optional = true }
image = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
nana-svg-raster = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
nana-ui-core.workspace = true
nana-ui-runtime.workspace = true
nana-ui-scene.workspace = true
nana-ui-platform = { workspace = true, features = ["clipboard"] }
nana-window = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
nana-app-icon = { workspace = true, optional = true, features = ["runtime"] }
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

# winit → android-activity has no default activity backend; align with Nana host.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.26.3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
accesskit_unix = { version = "0.22.1", optional = true, default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.34.0", optional = true }

[[example]]
name = "hosted-gpu-demo"
required-features = ["hosted", "bundled-fonts"]

[[example]]
name = "gpu-view-demo"
required-features = ["hosted", "bundled-fonts"]

[[example]]
name = "transparent-window"
required-features = ["hosted", "bundled-fonts"]

[[example]]
name = "window-chrome-multi-window"
required-features = ["hosted", "bundled-fonts"]

[[bin]]
name = "nana-gpu-scene-benchmark"
path = "src/bin/nana-gpu-scene-benchmark.rs"
required-features = ["gpu"]


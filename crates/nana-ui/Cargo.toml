[package]
name = "nana-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Rust-native UI foundation for the Nana application family"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui"
path = "src/lib.rs"

[features]
default = []
full = ["bundled-fonts", "components", "hosted", "syntax-highlighting"]
bundled-fonts = []
components = [
    "calendar",
    "charts",
    "controls",
    "feedback",
    "graph-canvas",
    "image-viewer",
    "overlays",
    "popover",
    "qr-code",
    "rich-text",
    "math",
    "diagrams",
    "selects",
    "settings-components",
    "surfaces",
    "xy-pad",
]
calendar = []
charts = []
controls = []
syntax-highlighting = [
    "controls",
    "iced/highlighter",
    "nana-ui-runtime/syntax-highlighting",
]
feedback = []
graph-canvas = []
image-viewer = []
overlays = []
popover = []
qr-code = ["dep:qrcode"]
rich-text = ["dep:pulldown-cmark"]
math = ["rich-text", "dep:ratex-layout", "dep:ratex-parser", "dep:ratex-svg", "dep:ratex-types"]
diagrams = ["rich-text", "dep:merman", "dep:roughr-merman"]
selects = []
settings-components = ["controls"]
surfaces = ["feedback"]
xy-pad = []
gpu = ["dep:bytemuck", "dep:iced_wgpu", "dep:wgpu"]
hosted = [
    "gpu",
    "dep:accesskit",
    "dep:accesskit_winit",
    "dep:iced_wgpu",
    "dep:iced_winit",
    "dep:image",
    "dep:raw-window-handle",
    "dep:windows",
]
browser = ["hosted", "dep:wry"]

[dependencies]
accesskit = { version = "0.24.1", optional = true }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
iced.workspace = true
iced_wgpu = { workspace = true, optional = true }
iced_winit = { workspace = true, optional = true }
nana-ui-core.workspace = true
nana-ui-runtime.workspace = true
nana-ui-scene.workspace = true
nana-ui-platform = { workspace = true, features = ["clipboard"] }
nana-window = { path = "../nana-window" }
merman = { version = "=0.7.0-alpha.1", default-features = false, features = ["render", "ratex-math"], optional = true }
roughr-merman = { version = "=0.12.0", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
unicode-segmentation.workspace = true
ratex-layout = { version = "0.1.14", optional = true }
ratex-parser = { version = "0.1.14", optional = true }
ratex-svg = { version = "0.1.14", features = ["embed-fonts"], optional = true }
ratex-types = { version = "0.1.14", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { workspace = true, optional = true }

# winit → android-activity has no default activity backend; align with Nana host.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
accesskit_winit = { path = "../../vendor/accesskit_winit", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "=0.55.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
], optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
iced_wgpu.workspace = true
iced_winit.workspace = true

[[example]]
name = "transparent-window"
path = "examples/transparent-window.rs"
required-features = ["bundled-fonts"]

[[example]]
name = "gpu-view-demo"
path = "examples/gpu-view-demo.rs"
required-features = ["bundled-fonts", "gpu"]

[[example]]
name = "hosted-gpu-demo"
path = "examples/hosted-gpu-demo.rs"
required-features = ["bundled-fonts", "hosted"]

[[example]]
name = "window-chrome-multi-window"
path = "examples/window-chrome-multi-window.rs"
required-features = ["bundled-fonts"]

[package]
name = "nana-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Rust-native UI foundation for the Nana application family"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui"
path = "src/lib.rs"

[features]
default = []
full = ["bundled-fonts", "components", "hosted", "syntax-highlighting"]
bundled-fonts = []
components = [
    "calendar",
    "charts",
    "controls",
    "feedback",
    "graph-canvas",
    "image-viewer",
    "overlays",
    "popover",
    "qr-code",
    "rich-text",
    "math",
    "diagrams",
    "selects",
    "settings-components",
    "surfaces",
    "xy-pad",
]
calendar = []
charts = []
controls = []
syntax-highlighting = [
    "controls",
    "nana-ui-runtime/syntax-highlighting",
]
feedback = []
graph-canvas = []
image-viewer = []
overlays = []
popover = []
# Compatibility flags. QrCode / markdown parse live in nana-ui-runtime;
# mermaid and math fences are host-owned presenter slots, not extra crates.
qr-code = []
rich-text = []
math = ["rich-text"]
diagrams = ["rich-text"]
selects = []
settings-components = ["controls"]
surfaces = ["feedback"]
xy-pad = []
gpu = ["dep:bytemuck", "dep:base64", "dep:cryoglyph", "dep:image", "dep:pollster", "dep:resvg", "dep:tiny-skia", "dep:ureq", "dep:url", "dep:wgpu"]
hosted = [
    "gpu",
    "dep:accesskit",
    "dep:accesskit_winit",
    "dep:android-activity",
    "dep:image",
    "dep:nana-app-icon",
    "dep:nana-window",
    "dep:raw-window-handle",
    "dep:windows",
    "dep:windows-sys",
    "dep:winit",
]

[dependencies]
accesskit = { version = "0.24.1", optional = true }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
base64 = { workspace = true, optional = true }
cosmic-text = "0.19"
cryoglyph = { git = "https://github.com/sena-nana/cryoglyph.git", rev = "3fe41b131eda1288d08df89ad5ba56de97713308", optional = true }
image = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
resvg = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
nana-ui-core.workspace = true
nana-ui-runtime.workspace = true
nana-ui-scene.workspace = true
nana-ui-platform = { workspace = true, features = ["clipboard"] }
nana-window = { workspace = true, optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
nana-app-icon = { workspace = true, optional = true, features = ["runtime"] }
unicode-segmentation.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

# winit → android-activity has no default activity backend; align with Nana host.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
accesskit_winit = { version = "0.33.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
], optional = true }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "hosted-gpu-demo"
required-features = ["hosted", "bundled-fonts"]

[[example]]
name = "gpu-view-demo"
required-features = ["hosted", "bundled-fonts"]

[[example]]
name = "transparent-window"
required-features = ["hosted", "bundled-fonts"]

[[example]]
name = "window-chrome-multi-window"
required-features = ["hosted", "bundled-fonts"]

[[bin]]
name = "nana-gpu-scene-benchmark"
path = "src/bin/nana-gpu-scene-benchmark.rs"
required-features = ["gpu"]


[package]
name = "nana-app-icon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Default application mark, PNG/ICO/ICNS encoding, and Windows PE icon embed"
license.workspace = true

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "icon", "packaging", "nanaui"]
categories = ["gui"]
[lints]

[features]
default = ["runtime"]
runtime = ["dep:nana-ui-platform"]
embed = ["dep:embed-resource"]

[lib]
name = "nana_app_icon"
path = "src/lib.rs"

[dependencies]
nana-ui-platform = { workspace = true, optional = true, default-features = false }
image = { workspace = true }
flate2 = "1.1"
embed-resource = { version = "3.0", optional = true }

[package]
name = "nana-ui-vue"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Vue 3 custom-renderer host coordination (engine-agnostic; NanaUI draws UI)"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui_vue"
path = "src/lib.rs"

[features]
default = []
benchmark = ["dep:serde", "dep:serde_json"]
# Scene/Runtime adapter. Uses nana-ui Runtime types; product paint goes
# through UiScene. Does not build an iced::Element tree.
scene-view = [
    "dep:nana-ui",
    "nana-ui/gpu",
    "nana-ui/syntax-highlighting",
    "nana-ui-runtime/syntax-highlighting",
]
# Compatibility alias of `scene-view`. Not the product feature name; keep for
# existing `--features iced-view` consumers. Prefer `scene-view`.
iced-view = ["scene-view"]
# Direct adapter into nana-ui's Scene-hosted runtime.
hosted = ["scene-view", "nana-ui/hosted", "dep:wgpu"]

[dependencies]
nana-ui-core.workspace = true
nana-ui-runtime.workspace = true
nana-ui-scene.workspace = true
nana-js-engine.workspace = true
nana-ui-web-api.workspace = true
nana-ui-platform.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
nana-ui = { path = "../nana-ui", optional = true, default-features = false }
wgpu = { workspace = true, optional = true }
# Intentionally NOT depending on nana-js-quickjs or nana-js-v8.

[[bin]]
name = "nana-vue-runtime-benchmark"
path = "src/bin/nana-vue-runtime-benchmark.rs"
required-features = ["benchmark"]

[package]
name = "nana-ui-vue"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Vue 3 custom-renderer host coordination (engine-agnostic; NanaUI draws UI)"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui_vue"
path = "src/lib.rs"

[features]
default = []
benchmark = ["dep:serde", "dep:serde_json"]
# Draw semantic trees with real NanaUI Iced widgets (layout + base control variants).
# Blitz-era empty flags (`layout` / `paint-stub` / `paint-vello`) were removed — use iced-view.
iced-view = [
    "dep:iced",
    "dep:nana-ui",
    "nana-ui/controls",
    "nana-ui/surfaces",
    "nana-ui/feedback",
    "nana-ui/overlays",
    "nana-ui/popover",
    "nana-ui/gpu",
]
# Direct adapter into nana-ui's existing multi-window hosted runtime.
hosted = ["iced-view", "nana-ui/hosted"]

[dependencies]
nana-ui-core.workspace = true
nana-ui-runtime.workspace = true
nana-ui-scene.workspace = true
nana-js-engine.workspace = true
nana-ui-web-api.workspace = true
nana-ui-platform.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
iced = { workspace = true, optional = true }
nana-ui = { path = "../nana-ui", optional = true, default-features = false }
# Intentionally NOT depending on nana-js-quickjs, nana-js-v8, or nana-ui-blitz.

[[bin]]
name = "nana-vue-runtime-benchmark"
path = "src/bin/nana-vue-runtime-benchmark.rs"
required-features = ["benchmark"]

[package]
name = "nana-ui-viewport3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Optional lightweight 3D preview viewport for NanaUI (orbit camera, glTF, basic lighting, HostTexture output)"
license.workspace = true

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gui", "3d", "viewport", "wgpu", "nanaui"]
categories = ["graphics", "rendering", "gui"]
[lib]
name = "nana_ui_viewport3d"
path = "src/lib.rs"

[[example]]
name = "model-viewer"
path = "examples/model-viewer.rs"
required-features = ["hosted"]
test = false

[features]
default = ["gltf"]
gltf = ["dep:gltf", "dep:image"]
hosted = ["nana-ui/hosted", "nana-ui/bundled-fonts", "nana-ui/view-macro"]

[dependencies]
nana-gpu = { workspace = true, features = ["wgpu-interop"] }
# Not `workspace = true`: the workspace entry keeps nana-ui's default features
# on for the other members, and cargo refuses `default-features = false` on an
# inherited dependency whose workspace entry has them on.
nana-ui = { version = "0.1.0-alpha.1", path = "../nana-ui", default-features = false, features = ["gpu", "wgpu-interop", "runtime-wgsl"] }
glam = { workspace = true }
bytemuck = { workspace = true }
gltf = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[dev-dependencies]
nana-ui-platform = { workspace = true }
pollster = { workspace = true }

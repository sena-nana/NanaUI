[package]
name = "nana-ui-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Backend-neutral retained runtime for NanaUI"
license = "MIT OR Apache-2.0"

[features]
calendar = []
charts = []
controls = []
graph-canvas = []
image-viewer = []
rich-text = ["dep:pulldown-cmark", "dep:mermaid-svg", "dep:ratex-parser", "dep:ratex-layout", "dep:ratex-svg", "dep:ratex-types"]
components = ["calendar", "charts", "controls", "graph-canvas", "image-viewer", "rich-text"]
default = ["icu"]
# Locale-aware message formatting with ICU4X and its compiled CLDR data:
# plural rules, numbers, dates and times. Without it messages format with
# `PlainFormatter`.
icu = [
    "dep:icu_calendar",
    "dep:icu_datetime",
    "dep:icu_decimal",
    "dep:icu_locale_core",
    "dep:icu_plurals",
    "dep:icu_provider",
    "dep:icu_time",
    "dep:fixed_decimal",
    "dep:writeable",
]
benchmark = []
# Lay the document out again from nothing after every retained pass and
# require the same boxes (always on in this crate's tests).
layout-verify = []
# Records the reactive causal chain into a preallocated ring for "why did this update".
reactive-trace = []
# The `view!` template macro over the view layer (a separate proc-macro crate).
view-macro = ["dep:nana-ui-view-macros"]
syntax-highlighting = ["dep:two-face"]

[dependencies]
fancy-regex = "0.16.2"
hashbrown = "0.16.1"
nana-ui-view-schema = { path = "../nana-ui-view-schema" }
futures-core.workspace = true
nana-ui-core.workspace = true
nana-diagnostics.workspace = true
# Canonical input and the host services contract. Input routing, focus and IME
# state are Runtime responsibilities; the contract crate has no platform deps.
nana-ui-input.workspace = true
# Issue #95: the retained text node resolves through `nana-text`'s engine and
# keeps its layouts behind `nana-text` handles.
nana-text.workspace = true
nana-ui-view-macros = { path = "../nana-ui-view-macros", optional = true }
mermaid-svg = { version = "=0.7.0", optional = true }
ratex-parser = { version = "=0.1.14", optional = true }
ratex-layout = { version = "=0.1.14", optional = true }
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"], optional = true }
ratex-types = { version = "=0.1.14", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
qrcode = { version = "0.14.1", default-features = false }
unicode-segmentation.workspace = true
unicode-width.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"], optional = true }
icu_calendar = { version = "2.3", optional = true }
icu_datetime = { version = "2.3", optional = true }
icu_decimal = { version = "2.3", features = ["ryu"], optional = true }
icu_locale_core = { version = "2.3", optional = true }
icu_plurals = { version = "2.3", optional = true }
# Formatters are shared across threads with the world they format for.
icu_provider = { version = "2.3", features = ["sync"], optional = true }
icu_time = { version = "2.3", optional = true }
fixed_decimal = { version = "0.7", features = ["ryu"], optional = true }
writeable = { version = "0.6", optional = true }

[[bin]]
name = "nana-runtime-benchmark"
path = "src/bin/nana-runtime-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-framework-benchmark"
path = "src/bin/nana-framework-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-reactive-benchmark"
path = "src/bin/nana-reactive-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-theme-benchmark"
path = "src/bin/nana-theme-benchmark.rs"
required-features = ["benchmark"]

[package]
name = "nana-icons-tabler"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Full Tabler outline icon catalog as typed NanaUI `Icon` constants (generated)"
license = "MIT"
publish = false

[lib]
name = "nana_icons_tabler"
path = "src/lib.rs"

[dependencies]
nana-ui-core = { path = "../nana-ui-core" }

# A workspace of its own (it is excluded from NanaUI's and keeps its own
# Cargo.lock), so cargo does not look for one in an enclosing checkout.
[workspace]

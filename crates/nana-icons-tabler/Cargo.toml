[package]
name = "nana-icons-tabler"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
description = "Full Tabler outline icon catalog as typed NanaUI `Icon` constants (generated)"
license = "MIT"

repository = "https://github.com/sena-nana/NanaUI"
homepage = "https://github.com/sena-nana/NanaUI"
readme = "README.md"
keywords = ["gui", "ui", "icons", "tabler", "nanaui"]
categories = ["gui"]
[lib]
name = "nana_icons_tabler"
path = "src/lib.rs"

[dependencies]
nana-ui-core = { version = "0.1.0-alpha.1", path = "../nana-ui-core" }

# A workspace of its own (it is excluded from NanaUI's and keeps its own
# Cargo.lock), so cargo does not look for one in an enclosing checkout.
[workspace]

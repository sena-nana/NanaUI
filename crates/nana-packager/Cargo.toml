[package]
name = "nana-packager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build-side Nana packager: pack plans, .nrpack building, platform layouts, Steam output and final-artifact validation"
license.workspace = true

# Build tool only. Nothing that ships in an application may depend on this
# crate (`scripts/check-package-boundary.py`). It never runs cargo: it takes
# an already built executable, so the dist pipeline (Issue #158) stays the
# single build authority and calls this as one step.

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["packaging", "bundler", "cli", "nanaui"]
categories = ["development-tools"]
[lib]
name = "nana_packager"
path = "src/lib.rs"

[[bin]]
name = "nana-packager"
path = "src/main.rs"
test = false

[dependencies]
nana-package.workspace = true
nana-app-icon = { workspace = true, default-features = false }
serde.workspace = true
base64.workspace = true
serde_json.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
# Pure-Rust deflate (miniz_oxide) for .deb members.
flate2 = "1.1"
getrandom.workspace = true
object.workspace = true
toml.workspace = true
zstd.workspace = true
zeroize.workspace = true

[dev-dependencies]
nana-ui-platform = { workspace = true, default-features = false }

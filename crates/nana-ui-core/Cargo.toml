[package]
name = "nana-ui-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Backend-neutral NanaUI design tokens, workspace contracts, and component semantics"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

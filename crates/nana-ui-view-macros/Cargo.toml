[package]
name = "nana-ui-view-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The view! template macro and #[derive(Store)] for nana-ui-runtime's declarative views"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
nana-ui-view-codegen = { path = "../nana-ui-view-codegen" }
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

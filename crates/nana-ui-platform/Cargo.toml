[package]
name = "nana-ui-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Android/desktop input, IME, clipboard, and fetch host boundary"
license = "MIT OR Apache-2.0"

[features]
default = ["clipboard", "fetch"]
clipboard = ["dep:arboard"]
fetch = ["dep:url", "dep:ureq"]
ws = ["dep:url", "dep:tungstenite"]
experimental-android = []

[lib]
name = "nana_ui_platform"
path = "src/lib.rs"

[dependencies]
nana-ui-core.workspace = true
serde.workspace = true
serde_json.workspace = true
url = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }

# Desktop OS clipboard only. Android does not compile arboard; the Android
# host uses JNI ClipboardManager ([`AndroidClipboard`]).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6", default-features = false, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1.1"

[dev-dependencies]
serde_json.workspace = true

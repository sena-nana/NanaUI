[package]
name = "nana-text"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Nana-native text IR, stable text ids, and migration parity contracts"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_text"
path = "src/lib.rs"

[features]
default = []
# Glyph rasterization on the CPU (`raster`): what the renderer scales its
# atlas glyphs with, and what a host that composites text itself uses.
raster = ["dep:zeno", "dep:png"]
# Optional OpenType `SVG ` table glyph rasterization via `nana-svg-raster`.
svg = ["raster", "dep:nana-svg-raster"]
# Migration parity corpus and structural diff against frozen goldens.
parity = []

[dependencies]
nana-ui-core.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
unicode-segmentation.workspace = true
# Issue #90: mature implementations behind private modules. None of their types
# may appear in the public API; `scripts/check-engine-boundary.py` pins each one
# to the single `src/font/` file allowed to name it.
# System font discovery and name/OS2 metadata parsing (`font/discovery.rs`).
fontdb = "0.24"
# System font files mapped instead of read (`font/mapped.rs`). `fontdb` already
# brings it in; this names it so the font set can keep the mapping.
memmap2 = "0.9"
# Variation axes, named instances, colour tables, cmap (`font/face.rs`). Same
# read-fonts line as harfrust 0.12, which Phase 2 shapes with.
skrifa = "0.44"
# Issue #91: OpenType shaping (`shaping/opentype.rs`) and the Unicode
# Bidirectional Algorithm (`shaping/bidi.rs`), each named from that file only.
harfrust = "0.12"
unicode-bidi = "0.3.18"
# Issue #92: UAX #14 line break opportunities (`layout/breaks.rs`), named from
# that file only.
unicode-linebreak = "0.1.5"
# Glyph outlines and colour bitmaps rasterized on the CPU
# (`raster/outline.rs`), named from that file only.
zeno = { workspace = true, optional = true }
png = { workspace = true, optional = true }
nana-svg-raster = { workspace = true, optional = true }

[dev-dependencies]
nana-ui-core = { workspace = true, features = ["bundled-fonts"] }
# Tests read outlines back to prove resolved axis coordinates reach the face.
skrifa = "0.44"

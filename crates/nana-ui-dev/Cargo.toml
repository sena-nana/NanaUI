[package]
name = "nana-ui-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Development-only hot reload support for NanaUI applications"
license.workspace = true

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gui", "hot-reload", "devtools", "nanaui"]
categories = ["development-tools", "gui"]
[lib]
name = "nana_ui_dev"
path = "src/lib.rs"

[features]
default = []
# Lets a dev binary answer the headless Agent flags (`--stdio`, `--screenshot`,
# `--a11y`) from the same document it puts in a window, so a rebuild can be
# verified without opening one. Off by default: an L3 project that only wants
# the restart loop should not build an offscreen WGPU stack to get it.
headless = ["dep:nana-ui-devtools"]
# Hot text for `.vue` views compiled in hot mode (`watch_templates`): a save
# that changes only static text reaches the running window without a rebuild.
templates = ["dep:nana-ui-sfc"]

[dependencies]
nana-ui-core.workspace = true
# `RuntimeProgramContext` lives behind `hosted`; the dev entry points need it.
nana-ui = { workspace = true, features = ["hosted"] }
# Default features are exactly `macos_fsevent`. Do NOT pass
# `default-features = false`: that drops FSEvents and silently degrades
# `RecommendedWatcher` to a polling watcher on the primary dev platform.
notify = "8.2"
serde.workspace = true
serde_json.workspace = true
# `runtime-agent`: offscreen pixels and the JSON protocol.
nana-ui-devtools = { workspace = true, optional = true, features = ["runtime-agent"] }
nana-ui-sfc = { workspace = true, optional = true }

[dev-dependencies]
nana-ui-platform.workspace = true
nana-ui-runtime.workspace = true
nana-ui-scene.workspace = true

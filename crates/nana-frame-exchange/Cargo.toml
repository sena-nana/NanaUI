[package]
name = "nana-frame-exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded latest-frame exchange from a producer thread to a consumer on one shared NanaUI GPU device"
license.workspace = true

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gpu", "wgpu", "frame", "texture", "nanaui"]
categories = ["graphics"]
[lints]

[lib]
name = "nana_frame_exchange"
path = "src/lib.rs"

[features]
default = []
# `FrameExchange::copy_from_wgpu` for producers that render into raw WGPU
# textures; see nana-gpu's `wgpu-interop`.
wgpu-interop = ["nana-gpu/wgpu-interop"]

[dependencies]
nana-gpu.workspace = true
wgpu.workspace = true

[dev-dependencies]
wgpu = { workspace = true, features = ["dx12", "gles", "metal", "vulkan"] }
pollster.workspace = true

[package]
name = "nana-ui-scene"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Backend-neutral retained scene and render graph for NanaUI"
license = "MIT OR Apache-2.0"

[features]
calendar = ["nana-ui-runtime/calendar"]
charts = ["nana-ui-runtime/charts"]
controls = ["nana-ui-runtime/controls"]
graph-canvas = ["nana-ui-runtime/graph-canvas"]
image-viewer = ["nana-ui-runtime/image-viewer"]
rich-text = ["nana-ui-runtime/rich-text"]
components = ["calendar", "charts", "controls", "graph-canvas", "image-viewer", "rich-text"]
default = []
benchmark = ["dep:serde", "dep:serde_json", "dep:nana-text", "nana-ui-core/bundled-font-regular", "nana-ui-runtime/benchmark"]

[dependencies]
nana-ui-core.workspace = true
nana-ui-runtime.workspace = true
# Benchmark only: `nana-dirty-frame-benchmark --engine nana-text`.
nana-text = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
nana-text.workspace = true
nana-ui-core = { workspace = true, features = ["bundled-font-regular"] }

[[bin]]
name = "nana-dirty-frame-benchmark"
path = "src/bin/nana-dirty-frame-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-text-edit-benchmark"
path = "src/bin/nana-text-edit-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-scene-benchmark"
path = "src/bin/nana-scene-benchmark.rs"
required-features = ["benchmark"]

[[test]]
name = "sidebar_row_label_paints_once"
path = "tests/sidebar_row_label_paints_once.rs"
required-features = ["controls"]

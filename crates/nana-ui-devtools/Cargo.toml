[package]
name = "nana-ui-devtools"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "NanaUI headless Agent snapshot session and offscreen diagnostics"
license = "MIT OR Apache-2.0"

[lints]

[lib]
name = "nana_ui_devtools"
path = "src/lib.rs"

[[bin]]
name = "nana-runtime-agent"
path = "src/bin/nana-runtime-agent.rs"
required-features = ["runtime-agent"]
test = false

# Per-event input routing cost on the L3 path, without paint.
[[bin]]
name = "nana-input-benchmark"
path = "src/bin/nana-input-benchmark.rs"
required-features = ["runtime-agent"]
test = false

[features]
default = []
offscreen = [
    "dep:nana-ui",
    "dep:nana-ui-scene",
    "nana-ui/gpu",
    "nana-ui/bundled-fonts",
    # Snapshot readback records its own copies on the snapshot device, through
    # nana_gpu::__framework like the framework's own painter.
    "dep:nana-gpu",
    "dep:image",
    "dep:png",
    "dep:pollster",
    "dep:wgpu",
]
# Headless session for a Rust Runtime document: offscreen pixels, a11y dump,
# pointer/keyboard/scroll.
runtime-agent = [
    "offscreen",
    "dep:nana-ui-platform",
    "dep:serde",
    "dep:serde_json",
]
# A whole RuntimeProgram offscreen: its hooks driven by the framework's
# headless host, its windows painted and read back.
headless-host = ["runtime-agent", "nana-ui/hosted"]
# Why a node last changed, in the runtime session's view inspector.
reactive-trace = ["runtime-agent", "nana-ui/reactive-trace"]

[dependencies]
nana-ui-core.workspace = true
nana-ui-platform = { workspace = true, optional = true }
nana-ui = { workspace = true, optional = true }
nana-ui-scene = { workspace = true, optional = true }
image = { workspace = true, optional = true }
png = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
nana-gpu = { workspace = true, optional = true }


[[example]]
name = "restored-content-probe"
required-features = ["runtime-agent", "nana-ui/components"]

[[example]]
name = "diagram-probe"
required-features = ["runtime-agent", "nana-ui/components"]

[[test]]
name = "devtools_components"
path = "tests/devtools_components/main.rs"
required-features = ["runtime-agent", "nana-ui/components"]

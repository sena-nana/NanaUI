[package]
name = "nana-ui-view-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Template element tree to nana-ui-runtime view calls, shared by view! and the .vue dialect compiler"
license.workspace = true

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gui", "codegen", "templates", "nanaui"]
categories = ["gui", "development-tools"]
[dependencies]
# Styles are parsed and matched with the one CSS engine.
nana-ui-css.workspace = true
nana-ui-core.workspace = true
nana-ui-view-schema.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full"] }

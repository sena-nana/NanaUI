[package]
name = "nana-ui-view-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Template element tree to nana-ui-runtime view calls, shared by view! and the .vue dialect compiler"
license = "MIT OR Apache-2.0"

[dependencies]
# Styles are parsed and matched with the engine the Vue path runs.
nana-ui-css.workspace = true
nana-ui-core.workspace = true
serde_json.workspace = true
nana-ui-view-schema = { path = "../nana-ui-view-schema" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

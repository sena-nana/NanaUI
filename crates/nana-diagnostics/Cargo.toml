[package]
name = "nana-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Low-overhead structured diagnostics: events, metrics, faults, flight recorder, and the .nlog format"
license.workspace = true

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["diagnostics", "logging", "metrics", "tracing", "nanaui"]
categories = ["development-tools"]
[features]
default = []
# Builds the `nana-diagnostics-benchmark` bin.
benchmark = []

[lib]
name = "nana_diagnostics"
path = "src/lib.rs"

[[bin]]
name = "nana-nlog"
path = "src/bin/nana-nlog.rs"
test = false

[[bin]]
name = "nana-diagnostics-benchmark"
path = "src/bin/nana-diagnostics-benchmark.rs"
required-features = ["benchmark"]
test = false

# The stall watchdog's stack samples and symbols on Apple and Linux/Android.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# Worker thread priority, the monotonic clock origin, the stall
# watchdog's stack samples, and the native crash handler.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[package]
name = "nana-window"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native window material boundary for Nana applications"
license = "MIT OR Apache-2.0"

[dependencies]
raw-window-handle = "0.6"
window-vibrancy = "0.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

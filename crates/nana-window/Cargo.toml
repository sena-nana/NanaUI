[package]
name = "nana-window"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native window material boundary for Nana applications"
license = "MIT OR Apache-2.0"

[dependencies]
nana-ui-core.workspace = true
raw-window-handle.workspace = true
window-vibrancy = "0.8.0"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2 = "0.6.2"
objc2-app-kit = { workspace = true, default-features = false, features = ["NSAnimation", "NSAnimationContext", "NSApplication", "NSGraphics", "NSEvent", "NSView", "NSWindow", "NSImage", "NSButton", "NSControl", "NSCell", "NSMenu", "NSMenuItem", "NSOpenPanel", "block2", "NSPanel", "NSResponder", "NSSavePanel", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { workspace = true, default-features = false, features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSEnumerator",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGColor"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAAnimation", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CAMetalLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# Early Splash decodes its logo to pixels for DirectComposition.
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
ashpd = { version = "0.11", default-features = false, features = ["async-std", "raw_handle", "wayland"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
# Match the host's dynamically loaded Wayland backend, including standalone users.
wayland-backend = { version = "0.3", features = ["dlopen"] }
futures-lite = "2"
async-channel = "2"
async-process = "2"
rand = "0.9"

[dev-dependencies]
png = "0.18"

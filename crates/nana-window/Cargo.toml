[package]
name = "nana-window"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native window material boundary for Nana applications"
license = "MIT OR Apache-2.0"

[dependencies]
raw-window-handle.workspace = true
window-vibrancy = "0.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, default-features = false, features = ["NSApplication", "NSEvent", "NSView", "NSWindow", "NSImage", "NSButton", "NSControl", "NSResponder", "objc2-quartz-core"] }
objc2-foundation = { workspace = true, default-features = false, features = [
    "NSData",
    "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CAMetalLayer", "objc2-metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

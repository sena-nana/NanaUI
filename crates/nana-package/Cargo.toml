[package]
name = "nana-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime side of the Nana packaging contract: package manifest, .nrpack resource packs, content keys and publisher signatures"
license.workspace = true

# Linked into shipped applications (behind `nana-ui/packaged-resources`), so
# every dependency here is pure Rust: no zstd C library, no ring, no system
# RNG. Randomness and compression live in `nana-packager`, which never ships.
# `scripts/check-package-boundary.py` enforces this.

repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["packaging", "resources", "assets", "nanaui"]
categories = ["development-tools"]
[lib]
name = "nana_package"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
ruzstd.workspace = true
zeroize.workspace = true

[package]
name = "nana-js-v8"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "V8 backend for NanaUI Vue via crates.io v8 150.4.0 (rusty_v8 successor)"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_js_v8"
path = "src/lib.rs"

[[bin]]
name = "nana-v8-snapshot"
path = "src/bin/nana_v8_snapshot.rs"
required-features = ["engine"]

[features]
default = []
# Phase 2: enable when wiring JsEngine. Keeps default workspace builds free of V8 compile.
engine = ["dep:v8"]

[dependencies]
nana-js-engine.workspace = true
serde_json.workspace = true
# Authoritative pin: workspace.dependencies v8 = "150.4.0"
# `v8` is the crates.io successor package name for the former `rusty_v8` binding —
# not a different JS engine. Do NOT depend on legacy rusty_v8 0.32.1.
v8 = { workspace = true, optional = true }

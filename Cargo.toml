[workspace]
members = [
    "crates/nana-ui-core",
    "crates/nana-ui-runtime",
    "crates/nana-ui-scene",
    "crates/nana-ui",
    "crates/nana-window",
    "crates/nana-app-icon",
    "crates/nana-js-engine",
    "crates/nana-js-v8",
    "crates/nana-ui-web-api",
    "crates/nana-svg-raster",
    "crates/nana-text",
    "crates/nana-ui-vue",
    "tools/css-parity",
    "crates/nana-ui-platform",
    "crates/nana-ui-devtools",
    "crates/nana-frame-exchange",
    "crates/nana-gpu",
    "crates/nana-diagnostics",
    "crates/nana-ui-dev",
    "crates/nana-package",
    "crates/nana-packager",
    "platform/android",
    "examples/component-gallery",
    "examples/vue-v8",
    "examples/vue-counter",
    "examples/vue-hosted-acceptance",
    "examples/native-rhi-probe",
    "examples/runtime-host-fixture",
    "examples/package-fixture",
]
resolver = "2"
exclude = ["tools/css-parity-webview", "crates/nana-icons-tabler"]

[workspace.dependencies]
nana-ui-core = { path = "crates/nana-ui-core" }
nana-icons-tabler = { path = "crates/nana-icons-tabler" }
nana-ui-runtime = { path = "crates/nana-ui-runtime" }
nana-ui-scene = { path = "crates/nana-ui-scene" }
nana-js-engine = { path = "crates/nana-js-engine" }
nana-js-v8 = { path = "crates/nana-js-v8" }
nana-ui-web-api = { path = "crates/nana-ui-web-api" }
nana-svg-raster = { path = "crates/nana-svg-raster" }
nana-text = { path = "crates/nana-text" }
nana-ui-vue = { path = "crates/nana-ui-vue" }
nana-ui-platform = { path = "crates/nana-ui-platform", default-features = false }
nana-ui-devtools = { path = "crates/nana-ui-devtools" }
nana-frame-exchange = { path = "crates/nana-frame-exchange" }
nana-gpu = { path = "crates/nana-gpu" }
nana-diagnostics = { path = "crates/nana-diagnostics" }
nana-ui-dev = { path = "crates/nana-ui-dev" }
nana-ui = { path = "crates/nana-ui" }
nana-window = { path = "crates/nana-window" }
nana-app-icon = { path = "crates/nana-app-icon", default-features = false }
nana-package = { path = "crates/nana-package" }
nana-packager = { path = "crates/nana-packager" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-core = "0.3.31"
base64 = "0.23"
crossbeam-channel = "0.5"
url = "2.5"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
# Keep a single WGPU major version across NanaUI.
wgpu = "30.0.0"
# Hosted desktop windowing. winit 0.31-line git rev, not the iced-rs fork.
# crates.io 0.31.0 stable is not required yet; pin exact sha (not floating master).
# rwh_06 is always-on in 0.31; x11/wayland features are Linux-only optional backends.
winit = { git = "https://github.com/rust-windowing/winit", rev = "874a1e31f194d11313c1ac133b28037b99db3e19", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
# Product JS engine. crates.io `v8` is the rusty_v8 successor package name.
v8 = "152.2.0"
tiny-skia = "0.12"
# Issue #217 custom paint: CPU path tessellation and polygon clipping.
lyon_tessellation = "1.0.22"
i_overlay = "9.0.0"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-segmentation = "1.13.0"
unicode-width = "0.2"
raw-window-handle = "0.6.2"
windows-sys = "0.61.2"
pollster = "1.0"
cpal = "0.15"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-metal = "0.3.2"
accesskit = "0.25.0"
accesskit_android = "0.8.0"
accesskit_macos = "0.27.0"
accesskit_windows = "0.35.0"
accesskit_unix = { version = "0.23.0", default-features = false, features = ["async-io"] }
# Issue #226 packaging. The runtime reader (`nana-package`) stays pure Rust:
# `blake3` without its C/asm backends, the RustCrypto AEAD and signature
# crates without their RNG features, and the pure-Rust zstd decoder. Only the
# build-side `nana-packager` links the C zstd encoder.
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
zeroize = "1.9.0"
zstd = { version = "0.14.0", default-features = false }
getrandom = "0.4.3"
toml = "1.1.4"
object = { version = "0.40.0", default-features = false, features = ["read_core", "std", "pe", "macho", "elf"] }

# Release/dist split. `release` stays stock so CI and the benchmarks keep their
# fast turnaround; `dist` is what packaging scripts build and is the only
# profile allowed into an .app bundle or an APK.
#
# `panic = "abort"` drops the unwind tables (~7 MB of __eh_frame /
# __unwind_info / __gcc_except_tab on the desktop binary). It also means a
# panicking native component aborts the process instead of surfacing a
# NativeComponentCommandError — see nana-ui-vue/src/native_component.rs.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Pack sealing, hashing and decoding run 20-50x slower unoptimized; the
# packager tests (a 20 MiB Steam delta corpus) and any debug build reading
# encrypted packs would crawl. Only these leaf crates are optimized.
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

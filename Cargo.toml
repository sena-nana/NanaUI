[workspace]
members = [
    "crates/nana-ui-core",
    "crates/nana-ui-runtime",
    "crates/nana-ui-view-schema",
    "crates/nana-ui-view-codegen",
    "crates/nana-ui-css",
    "crates/nana-ui-sfc",
    "crates/nana-ui-view-macros",
    "crates/nana-ui-charts",
    "crates/nana-ui-diagram",
    "crates/nana-ui-viewport3d",
    "crates/nana-ui-scene",
    "crates/nana-ui",
    "crates/nana-window",
    "crates/nana-app-icon",
    "crates/nana-svg-raster",
    "crates/nana-text",
    "tools/css-parity",
    "crates/nana-ui-platform",
    "crates/nana-ui-input",
    "crates/nana-ui-devtools",
    "crates/nana-frame-exchange",
    "crates/nana-gpu",
    "crates/nana-diagnostics",
    "crates/nana-ui-dev",
    "crates/nana-package",
    "crates/nana-packager",
    "platform/android",
    "platform/mobile-core",
    "platform/mobile-probe",
    "platform/ios",
    "platform/ios/probe",
    "examples/component-gallery",
    "examples/native-rhi-probe",
    "examples/runtime-host-fixture",
    "examples/realtime-fixture",
    "examples/package-fixture",
    "examples/reactive-sfc",
    "examples/task-workbench",
    # Tests for the wgpu fork's changes (the vendored crates are not members).
    "third_party/wgpu-fork-tests",
]
resolver = "2"
# `third_party/wgpu` holds NanaUI's wgpu fork and `third_party/accesskit` holds
# the Windows AccessKit fork: ordinary path dependencies, not members, so their
# tests and dev-dependencies stay out.
exclude = ["tools/css-parity-webview", "crates/nana-icons-tabler", "third_party/wgpu", "third_party/accesskit"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sena-nana/NanaUI"
homepage = "https://github.com/sena-nana/NanaUI"

[workspace.dependencies]
nana-ui-core = { version = "0.1.0-alpha.1", path = "crates/nana-ui-core" }
nana-icons-tabler = { version = "0.1.0-alpha.1", path = "crates/nana-icons-tabler" }
# Facades forward optional runtime capabilities explicitly. Inheriting these
# defaults would otherwise defeat an application's `default-features = false`.
nana-ui-runtime = { version = "0.1.0-alpha.1", path = "crates/nana-ui-runtime", default-features = false }
nana-ui-scene = { version = "0.1.0-alpha.1", path = "crates/nana-ui-scene", default-features = false }
nana-ui-charts = { version = "0.1.0-alpha.1", path = "crates/nana-ui-charts" }
nana-ui-diagram = { version = "0.1.0-alpha.1", path = "crates/nana-ui-diagram" }
nana-ui-viewport3d = { version = "0.1.0-alpha.1", path = "crates/nana-ui-viewport3d" }
nana-svg-raster = { version = "0.1.0-alpha.1", path = "crates/nana-svg-raster" }
nana-text = { version = "0.1.0-alpha.1", path = "crates/nana-text" }
nana-ui-platform = { version = "0.1.0-alpha.1", path = "crates/nana-ui-platform", default-features = false }
nana-ui-input = { version = "0.1.0-alpha.1", path = "crates/nana-ui-input" }
nana-ui-devtools = { version = "0.1.0-alpha.1", path = "crates/nana-ui-devtools" }
nana-frame-exchange = { version = "0.1.0-alpha.1", path = "crates/nana-frame-exchange" }
nana-gpu = { version = "0.1.0-alpha.1", path = "crates/nana-gpu" }
nana-diagnostics = { version = "0.1.0-alpha.1", path = "crates/nana-diagnostics" }
nana-ui-dev = { version = "0.1.0-alpha.1", path = "crates/nana-ui-dev" }
nana-ui-sfc = { version = "0.1.0-alpha.1", path = "crates/nana-ui-sfc" }
nana-ui-css = { version = "0.1.0-alpha.1", path = "crates/nana-ui-css" }
nana-ui-view-schema = { version = "0.1.0-alpha.1", path = "crates/nana-ui-view-schema" }
nana-ui-view-codegen = { version = "0.1.0-alpha.1", path = "crates/nana-ui-view-codegen" }
nana-ui-view-macros = { version = "0.1.0-alpha.1", path = "crates/nana-ui-view-macros" }
nana-ui = { version = "0.1.0-alpha.1", path = "crates/nana-ui" }
nana-window = { version = "0.1.0-alpha.1", path = "crates/nana-window" }
nana-app-icon = { version = "0.1.0-alpha.1", path = "crates/nana-app-icon", default-features = false }
nana-package = { version = "0.1.0-alpha.1", path = "crates/nana-package" }
nana-packager = { version = "0.1.0-alpha.1", path = "crates/nana-packager" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
url = "2.5"
sys-locale = "0.3.2"
# Exact pin: nana-ui-platform/src/fetch.rs implements ureq's `unversioned`
# resolver and transport traits, which ureq keeps outside semver.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
# wgpu and naga are NanaUI's fork in `third_party/wgpu` (upstream names and
# versions kept); every graph holds that one copy. A git dependency on this
# repository brings the fork along; an application that also uses wgpu
# ecosystem crates patches crates.io wgpu onto it (see third_party/wgpu).
# Framework crates never pick graphics backends by default (`default = []` on
# `nana-ui`, so only the platform primary backend compiles unless `wgpu-backends`
# or `full` is enabled). Applications with `default-features = false` or custom
# `wgpu` backend selections choose their own backends explicitly.
wgpu = { package = "nana-wgpu", version = "30.0.1-nana.1", path = "third_party/wgpu/wgpu", default-features = false, features = ["std", "parking_lot"] }
naga = { package = "nana-naga", version = "30.0.1-nana.1", path = "third_party/wgpu/naga", default-features = false }
# Hosted desktop windowing. winit 0.31-beta.4 from crates.io.
# rwh_06 is always-on in 0.31; x11/wayland features are Linux-only optional backends.
winit = { version = "0.31.0-beta.4", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
tiny-skia = "0.12"
# Issue #217 custom paint: CPU path tessellation and polygon clipping.
lyon_tessellation = "1.0.22"
i_overlay = "9.0.0"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18.1"
zeno = "0.3.3"
unicode-segmentation = "1.13.0"
unicode-width = "0.2"
raw-window-handle = "0.6.2"
windows-sys = "0.61.2"
pollster = "1.0"
glam = "0.30"
bytemuck = { version = "1.25", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-metal = "0.3.2"
# AccessKit crates from crates.io, except `nana-accesskit-windows` which carries
# unmerged upstream PR 816 (localized Switch + ScrollPattern).
# https://github.com/AccessKit/accesskit/pull/816
accesskit = "0.25.2"
accesskit_android = "0.9.1"
accesskit_macos = "0.27.2"
accesskit_windows = { package = "nana-accesskit-windows", version = "0.35.1-nana.1", path = "third_party/accesskit/windows" }
accesskit_unix = { version = "0.24.1", default-features = false, features = ["async-io"] }
# Issue #226 packaging. The runtime reader (`nana-package`) stays pure Rust:
# `blake3` without its C/asm backends, the RustCrypto AEAD and signature
# crates without their RNG features, and the pure-Rust zstd decoder. Only the
# build-side `nana-packager` links the C zstd encoder.
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
zeroize = "1.9.0"
zstd = { version = "0.14.0", default-features = false }
getrandom = "0.4.3"
toml = "1.1.4"
object = { version = "0.40.0", default-features = false, features = ["read_core", "std", "pe", "macho", "elf"] }

# Release/dist split. `release` stays stock so CI and the benchmarks keep their
# fast turnaround; `dist` is what packaging scripts build and is the only
# profile allowed into an .app bundle or an APK.
#
# `panic = "abort"` drops the unwind tables (~7 MB of __eh_frame /
# __unwind_info / __gcc_except_tab on the desktop binary). A panic anywhere
# aborts the process instead of unwinding.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Keep panic backtrace line numbers without paying full DWARF bloat and
# linker stalls locally (matches CI's line-tables-only policy).
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Pack sealing, hashing and decoding run 20-50x slower unoptimized; the
# packager tests (a 20 MiB Steam delta corpus) and any debug build reading
# encrypted packs would crawl. Only these leaf crates are optimized.
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

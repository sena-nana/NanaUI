[workspace]
members = [
    "crates/nana-ui-core",
    "crates/nana-ui-runtime",
    "crates/nana-ui-scene",
    "crates/nana-ui",
    "crates/nana-window",
    "crates/nana-app-icon",
    "crates/nana-js-engine",
    "crates/nana-js-v8",
    "crates/nana-ui-web-api",
    "crates/nana-svg-raster",
    "crates/nana-ui-vue",
    "tools/css-parity",
    "crates/nana-ui-platform",
    "crates/nana-ui-devtools",
    "platform/android",
    "examples/component-gallery",
    "examples/vue-v8",
    "examples/vue-counter",
    "examples/vue-hosted-acceptance",
    "examples/native-rhi-probe",
    "examples/runtime-host-fixture",
]
resolver = "2"
exclude = ["tools/css-parity-webview"]

[workspace.dependencies]
nana-ui-core = { path = "crates/nana-ui-core" }
nana-ui-runtime = { path = "crates/nana-ui-runtime" }
nana-ui-scene = { path = "crates/nana-ui-scene" }
nana-js-engine = { path = "crates/nana-js-engine" }
nana-js-v8 = { path = "crates/nana-js-v8" }
nana-ui-web-api = { path = "crates/nana-ui-web-api" }
nana-svg-raster = { path = "crates/nana-svg-raster" }
nana-ui-vue = { path = "crates/nana-ui-vue" }
nana-ui-platform = { path = "crates/nana-ui-platform", default-features = false }
nana-ui-devtools = { path = "crates/nana-ui-devtools" }
nana-ui = { path = "crates/nana-ui" }
nana-window = { path = "crates/nana-window" }
nana-app-icon = { path = "crates/nana-app-icon", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-core = "0.3.31"
base64 = "0.23"
crossbeam-channel = "0.5"
url = "2.5"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
# Keep a single WGPU major version across NanaUI.
wgpu = "30.0.0"
# Hosted desktop windowing. winit 0.31-line git rev, not the iced-rs fork.
# crates.io 0.31.0 stable is not required yet; pin exact sha (not floating master).
# rwh_06 is always-on in 0.31; x11/wayland features are Linux-only optional backends.
winit = { git = "https://github.com/rust-windowing/winit", rev = "874a1e31f194d11313c1ac133b28037b99db3e19", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
# Product JS engine. crates.io `v8` is the rusty_v8 successor package name.
v8 = "152.2.0"
tiny-skia = "0.12"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-segmentation = "1.13.0"
raw-window-handle = "0.6.2"
windows-sys = "0.61.2"
pollster = "1.0"
cosmic-text = "0.19"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-metal = "0.3.2"
accesskit = "0.25.0"
accesskit_android = "0.8.0"
accesskit_macos = "0.27.0"
accesskit_windows = "0.35.0"
accesskit_unix = { version = "0.23.0", default-features = false, features = ["async-io"] }

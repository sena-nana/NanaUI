[workspace]
members = [
    "crates/nana-ui-core",
    "crates/nana-ui-runtime",
    "crates/nana-ui-scene",
    "crates/nana-ui",
    "crates/nana-window",
    "crates/nana-js-engine",
    "crates/nana-js-quickjs",
    "crates/nana-js-v8",
    "crates/nana-ui-web-api",
    "crates/nana-ui-vue",
    "crates/nana-css-parity",
    "crates/nana-ui-platform",
    "crates/nana-ui-devtools",
    "platform/android",
    "examples/component-gallery",
    "examples/vue-quickjs",
    "examples/vue-v8",
    "examples/vue-counter",
    "examples/vue-hosted-acceptance",
    "examples/native-rhi-probe",
    "examples/runtime-host-fixture",
]
# engine/iced is the compatibility renderer fork. engine/gpui-scenario-bench is
# Issue #12 observation only (not a Nana product crate / renderer, not a #8 gate).
exclude = ["engine/iced", "engine/gpui-scenario-bench"]
resolver = "2"

[workspace.dependencies]
nana-ui-core = { path = "crates/nana-ui-core" }
nana-ui-runtime = { path = "crates/nana-ui-runtime" }
nana-ui-scene = { path = "crates/nana-ui-scene" }
nana-js-engine = { path = "crates/nana-js-engine" }
nana-js-quickjs = { path = "crates/nana-js-quickjs" }
nana-js-v8 = { path = "crates/nana-js-v8" }
nana-ui-web-api = { path = "crates/nana-ui-web-api" }
nana-ui-vue = { path = "crates/nana-ui-vue" }
nana-ui-platform = { path = "crates/nana-ui-platform", default-features = false }
nana-ui-devtools = { path = "crates/nana-ui-devtools" }
nana-ui = { path = "crates/nana-ui" }
nana-window = { path = "crates/nana-window" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }
futures-core = "0.3.31"
base64 = "0.22"
crossbeam-channel = "0.5"
url = "2.5"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
# Keep wgpu aligned with NanaUI/Iced. Single WGPU major version.
wgpu = "30.0.0"
# Phase 2 JS engines — apps link exactly one:
rquickjs = "0.12.2" # QuickJS-NG 0.15.1
# crates.io `v8` is the renamed successor of `rusty_v8` (same binding lineage).
# Do NOT pin the legacy `rusty_v8 = "0.32.1"` crate.
v8 = "150.4.0"
tiny-skia = "0.11.4"
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fontdue = "0.9"
unicode-segmentation = "1.13.0"

# nana-ui-platform clipboard uses arboard; vendor adds an Android stub so
# aarch64-linux-android still links. Desktop backends unchanged.
# Hosted desktop still pins the iced-rs winit fork (not an Android Iced dep).
[patch.crates-io]
arboard = { path = "vendor/arboard" }
winit = { git = "https://github.com/iced-rs/winit.git", rev = "05b8ff17a06562f0a10bb46e6eaacbe2a95cb5ed" }

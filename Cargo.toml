[workspace]
members = [
    "crates/nana-ui-core",
    "crates/nana-ui",
    "crates/nana-window",
    "crates/nana-js-engine",
    "crates/nana-js-quickjs",
    "crates/nana-js-v8",
    "crates/nana-ui-web-api",
    "crates/nana-ui-vue",
    "crates/nana-css-parity",
    "crates/nana-ui-platform",
    "crates/nana-ui-devtools",
    "platform/android",
    "examples/component-gallery",
    "examples/vue-quickjs",
    "examples/vue-v8",
    "examples/vue-counter",
]
resolver = "2"

[workspace.dependencies]
iced = {
    git = "https://github.com/sena-nana/iced.git",
    rev = "31bde4e4bac6de08f5ba581a8ea9c55ad0031e67",
    default-features = false,
    features = ["wgpu", "canvas", "image", "svg", "advanced", "smol", "thread-pool", "x11", "wayland"],
}
iced_wgpu = {
    git = "https://github.com/sena-nana/iced.git",
    rev = "31bde4e4bac6de08f5ba581a8ea9c55ad0031e67",
    features = ["svg-text"],
}
iced_winit = {
    git = "https://github.com/sena-nana/iced.git",
    rev = "31bde4e4bac6de08f5ba581a8ea9c55ad0031e67",
}
nana-ui-core = { path = "crates/nana-ui-core" }
nana-js-engine = { path = "crates/nana-js-engine" }
nana-js-quickjs = { path = "crates/nana-js-quickjs" }
nana-js-v8 = { path = "crates/nana-js-v8" }
nana-ui-web-api = { path = "crates/nana-ui-web-api" }
nana-ui-vue = { path = "crates/nana-ui-vue" }
nana-ui-platform = { path = "crates/nana-ui-platform" }
nana-ui-devtools = { path = "crates/nana-ui-devtools" }
nana-ui = { path = "crates/nana-ui" }
nana-window = { path = "crates/nana-window" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
url = "2.5"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
# Keep wgpu aligned with NanaUI/Iced. Single WGPU major version.
wgpu = "30.0.0"
# Phase 2 JS engines — apps link exactly one:
rquickjs = "0.12.2" # QuickJS-NG 0.15.1
# crates.io `v8` is the renamed successor of `rusty_v8` (same binding lineage).
# Do NOT pin the legacy `rusty_v8 = "0.32.1"` crate.
v8 = "150.4.0"

# iced_winit → arboard has no Android backend; vendor adds a stub platform so
# `nana-ui` can cross-compile to aarch64-linux-android. Desktop backends unchanged.
[patch.crates-io]
arboard = { path = "vendor/arboard" }

# iced_winit: Android lacks winit `modifier_supplement`; stub clipboard like wasm.
# iced_wgpu: a3bdc6f unit-struct `image::Batch` init breaks when `svg` enables Vec Batch.
[patch."https://github.com/sena-nana/iced.git"]
iced_winit = { path = "vendor/iced_winit" }
iced_wgpu = { path = "vendor/iced_wgpu" }

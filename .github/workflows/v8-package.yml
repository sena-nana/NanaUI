name: Package V8

# Source-build the workspace's pinned v8 for aarch64-linux-android. Official
# rusty_v8 releases omit this target. Manual only — GN+V8 is multi-hour.
#
# The version is read from Cargo.lock rather than written here: the previous
# hard-coded 150.4.0 outlived the workspace bump to 152.2.0, so the release tag
# named a version the job had not built.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach archives to the rusty-v8 release matching Cargo.lock
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-arm64:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      V8_FROM_SOURCE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Resolve pinned V8 version
        id: v8ver
        run: |
          version="$(python3 scripts/locked-crate-version.py v8)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building v8 ${version} (from Cargo.lock)"
      - name: Host deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libglib2.0-dev clang-19 libclang-19-dev gzip
          echo LIBCLANG_PATH=/usr/lib/llvm-19/lib >> "$GITHUB_ENV"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build and pack
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          source scripts/android-env.sh
          cargo build -p nana-js-v8 --features engine \
            --target aarch64-linux-android --release --locked
          bash scripts/package-v8-android.sh dist/v8
      - uses: actions/upload-artifact@v4
        with:
          name: rusty-v8-aarch64-linux-android
          path: dist/v8/
          if-no-files-found: error
      - name: GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rusty-v8-v${{ steps.v8ver.outputs.version }}
          files: dist/v8/*

  verify:
    needs: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - uses: actions/download-artifact@v4
        with:
          name: rusty-v8-aarch64-linux-android
          path: dist/v8
      - name: Link packaged V8 into Android host
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          source scripts/use-v8-prebuilt.sh dist/v8
          source scripts/android-env.sh
          bash scripts/check-android-arm64.sh --build

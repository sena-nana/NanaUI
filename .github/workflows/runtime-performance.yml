name: Runtime performance

# Weekly/dispatch timing and scale gate for Issue #8.
# Ordinary PR CI must not use these wall-clock thresholds. PR work-counter
# invariants live in .github/workflows/ci.yml (runtime-work-invariants).
#
# Scale split:
# - Static 100..10k full + 50k construction-only are weekly-eligible.
# - Virtual list/table 10k is weekly-eligible.
# - Virtual list/table 100k is weekly/dispatch only (never PR CI).
# - Virtual list/table 1M is NANA_PERF_SCALE=large only. The binary emits
#   status=skipped with null timings if construction exceeds 90s rather than
#   guessing a flake-prone threshold.
# - Virtual tree: Fenwick + AppContext::materialize_virtual_tree exist; there is
#   no scale bench this round. The framework report documents status=skipped.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  cpu-runtime-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Attempt 1M virtual materialize on weekly/dispatch. The harness skips
      # that case if it exceeds LARGE_SCALE_TIMEOUT instead of failing the job.
      NANA_PERF_SCALE: large
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release Runtime and Scene workloads
        run: |
          mkdir -p target/performance
          cargo run --quiet --release --locked -p nana-ui-runtime --features benchmark --bin nana-runtime-benchmark -- --output target/performance/runtime.json
          cargo run --quiet --release --locked -p nana-ui-runtime --features benchmark --bin nana-framework-benchmark -- --output target/performance/framework.json
          cargo run --quiet --release --locked -p nana-ui-vue --features benchmark --bin nana-vue-runtime-benchmark -- --output target/performance/vue.json
          cargo run --quiet --release --locked -p nana-ui-scene --features benchmark --bin nana-scene-benchmark -- --output target/performance/scene.json
      - name: Enforce incremental and latency gates
        run: |
          python3 scripts/validate-runtime-performance.py \
            --runtime target/performance/runtime.json \
            --framework target/performance/framework.json \
            --vue target/performance/vue.json \
            --scene target/performance/scene.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-scene-performance
          path: target/performance

  macos-composition:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run real WGPU UI and Live2D composition workload
        run: |
          mkdir -p target/performance
          cargo run --release --locked -p component-gallery \
            --features live2d-acceptance --bin ui-live2d-acceptance -- \
            --output target/performance/ui-live2d.json \
            --screenshot target/performance/ui-live2d.png
      - name: Enforce real GPU frame gates
        run: python3 scripts/validate-runtime-performance.py --gpu target/performance/ui-live2d.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-ui-live2d-performance
          path: target/performance

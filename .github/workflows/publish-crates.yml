name: Publish Crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run preflight check only, or check and publish to crates.io"
        type: choice
        options:
          - check
          - publish
        default: check
      wait_rate_limit:
        description: "Automatically wait and retry when crates.io returns HTTP 429"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Verify release tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/publish-crates.py --verify-tag "${GITHUB_REF_NAME}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check repository boundaries
        run: |
          python3 scripts/check-engine-boundary.py
          python3 scripts/check-package-boundary.py
          python3 scripts/check-api-convergence.py
      - name: Audit and package publishable crates
        run: python3 scripts/publish-crates.py --check

  publish:
    needs: preflight
    if: github.event_name == 'push' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: crates-io
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check crates.io token secret
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not configured (set it in the crates-io environment or repository secrets)." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Publish crates in topological order
        run: |
          WAIT_FLAG=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.wait_rate_limit }}" = "true" ]; then
            WAIT_FLAG="--wait-rate-limit"
          fi
          python3 scripts/publish-crates.py --publish ${WAIT_FLAG}

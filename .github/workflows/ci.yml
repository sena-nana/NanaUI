name: Rust

# Temporary evidence branch: record the lifecycle heap corruption under TTD.
on:
  push:

jobs:
  lifecycle-ttd:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: cargo build -p nana-ui --example window-service-lifecycle --features hosted,bundled-fonts,wgpu-interop --locked
      - name: Install TTD and WinDbg
        shell: pwsh
        run: ./.github/ttd/record.ps1
      - name: Record and analyze until a run corrupts the heap
        shell: pwsh
        timeout-minutes: 330
        run: |
          $ErrorActionPreference = 'Continue'
          $ttd = 'C:\ttdpkg\TTD.exe'
          $cdb = 'C:\windbgpkg\amd64\cdb.exe'
          $gflags = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\gflags.exe'
          & $gflags /p /enable window-service-lifecycle.exe /full | Out-Null
          New-Item -ItemType Directory -Force 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' | Out-Null
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' DontShowUI 1
          $env:PROBE_STOP_AFTER = '34'
          $env:PROBE_TIMEOUT_SCALE = '30'
          $env:_NT_SYMBOL_PATH = "srv*C:\sym*https://msdl.microsoft.com/download/symbols;$((Resolve-Path 'target\debug\examples').Path)"
          $exe = (Resolve-Path 'target\debug\examples\window-service-lifecycle.exe').Path
          $script = (Resolve-Path '.github\ttd\analyze.js').Path
          $deadline = (Get-Date).AddMinutes(310)
          for ($attempt = 1; (Get-Date) -lt $deadline; $attempt++) {
            $dir = "D:\traces\a$attempt"
            New-Item -ItemType Directory -Force $dir | Out-Null
            $started = Get-Date
            $p = Start-Process -FilePath $ttd -ArgumentList @('-accepteula', '-ring', '-maxFile', '100000', '-out', $dir, $exe) -PassThru -NoNewWindow -RedirectStandardOutput "$dir\ttd.out" -RedirectStandardError "$dir\ttd.err"
            $left = [int]($deadline - (Get-Date)).TotalMilliseconds
            if (-not $p.WaitForExit([Math]::Max($left, 1000))) { Write-Host "attempt $attempt ran out of time"; $p.Kill($true); break }
            $run = Get-ChildItem $dir -Filter *.run | Select-Object -First 1
            Write-Host ("attempt {0}: {1:N0} s, trace {2:N0} MB" -f $attempt, ((Get-Date) - $started).TotalSeconds, ($run.Length / 1MB))
            $log = "$dir\analysis.txt"
            & $cdb -z $run.FullName -c ".lines -e; .load JsProvider.dll; .scriptrun $script; q" 2>&1 |
              Where-Object { $_ -notmatch '^(ModLoad|Symbol search|Executable search|\*\*\*|\s+-->|\s+----)' } |
              Out-File $log -Encoding utf8
            $text = Get-Content $log -Raw
            if ($text -match 'RESULT freed block|RESULT no RtlFreeHeap') {
              Get-Content $log | Select-Object -First 2500
              break
            }
            Get-Content $log | Select-String -Pattern 'exception event|RESULT' | ForEach-Object { $_.Line }
            Remove-Item $dir -Recurse -Force
          }

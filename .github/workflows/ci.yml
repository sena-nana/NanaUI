name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Iced engine dependency boundary
        run: python3 scripts/check-engine-boundary.py
      - name: Rebuild Vue SFC compatibility fixture
        working-directory: crates/nana-js-engine/fixtures/vue-sfc-compat
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist
      - name: Check minimal feature set
        run: cargo check -p nana-ui --lib --no-default-features --locked
      - name: Check Gallery package boundary
        run: cargo check -p component-gallery --bin component-gallery --locked
      - name: Run default-feature tests
        run: cargo test --workspace --all-targets --locked
      - name: Check default-feature targets
        run: cargo check --workspace --all-targets --locked
      - name: Check legal feature combinations
        shell: bash
        run: |
          cargo check -p nana-ui --all-targets --all-features --locked
          cargo check -p component-gallery --all-targets --all-features --locked
          cargo check -p vue-counter --all-targets --features windowed --locked
          cargo check -p vue-counter --all-targets --no-default-features --features engine-v8,windowed --locked
      - name: Check macOS WebView reference
        if: runner.os == 'macOS'
        run: cargo check -p nana-css-parity --all-targets --features webview-ref --locked
      - name: Run workspace Clippy diagnostics
        run: cargo clippy --workspace --all-targets --locked
      - name: Enforce NanaUI and Gallery Clippy
        run: cargo clippy -p nana-ui -p component-gallery --all-targets --all-features --locked --no-deps -- -D warnings

  runtime-work-invariants:
    # Issue #8 PR gate: algorithmic work-counter / virtualization invariants.
    # Named cargo tests plus perf/contract.py --evaluate-invariants on fixture
    # runner envelopes. Live release benches are not required on every PR.
    # 100k/1M virtual materialize timing stays in runtime-performance.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Work-counter and virtualization invariants
        run: |
          # libtest is substring match; `|` is not a regex and `--exact` needs
          # the module-prefixed name. Unique function names are the filter.
          for name in \
            dirty_work_is_incremental_and_static_world_stays_idle \
            paint_only_style_change_does_not_schedule_subtree_layout \
            pointer_hover_and_press_are_runtime_owned_and_targeted \
            parking_or_removing_the_last_presence_node_returns_the_skip_path \
            transform_and_a11y_mutations_do_not_schedule_layout \
            work_counters_are_queryable_after_drain_and_extract \
            virtual_list_materializes_only_visible_items_and_reuses_overlap \
            virtual_table_materializes_a_bounded_grid_and_reuses_both_axes \
            virtual_tree_materializes_only_visible_rows_and_reuses_overlap_on_scroll_and_expand
          do
            cargo test -p nana-ui-runtime --lib --locked "$name"
          done
          python3 scripts/validate-runtime-performance.py --self-test
          python3 perf/contract.py --self-test
          mkdir -p target/performance/issue8/invariants
          python3 perf/runners/iced/run.py --scenario virtual-list-10k \
            --from-report perf/fixtures/iced-scenario-virtual-list-10k.json \
            --output target/performance/issue8/invariants/iced-virtual-list-10k.json
          python3 perf/runners/iced/run.py --scenario text-table \
            --from-report perf/fixtures/iced-scenario-text-table.json \
            --output target/performance/issue8/invariants/iced-text-table.json
          python3 perf/runners/iced/run.py --scenario hover \
            --from-report perf/fixtures/iced-scenario-hover.json \
            --output target/performance/issue8/invariants/iced-hover.json
          python3 perf/runners/iced/run.py --scenario mutation-paint-only \
            --from-report perf/fixtures/iced-scenario-mutation-paint-only.json \
            --output target/performance/issue8/invariants/iced-mutation-paint-only.json
          python3 perf/runners/nana/run.py --scenario text-table \
            --from-report perf/fixtures/virtual-table-scales.json \
            --output target/performance/issue8/invariants/nana-text-table.json
          python3 perf/runners/nana/run.py --scenario virtual-list-100k \
            --from-report perf/fixtures/virtual-scales-only.json \
            --output target/performance/issue8/invariants/nana-virtual-list-100k.json
          python3 perf/runners/nana/run.py --scenario virtual-tree-100k \
            --from-report perf/fixtures/virtual-tree-scales.json \
            --output target/performance/issue8/invariants/nana-virtual-tree-100k.json
          python3 perf/contract.py --evaluate-invariants target/performance/issue8/invariants

name: Rust

on:
  push:
  pull_request:

jobs:
  # Issue #345: the repository gate scripts run apart from `check`, so a red
  # gate no longer hides whether the Rust tests pass. The scripts read
  # `cargo metadata`, and they decode it differently on Windows, so they keep
  # all three platforms.
  gate-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check engine and text-stack dependency boundary
        run: python3 scripts/check-engine-boundary.py
      - name: Check API convergence boundaries
        run: python3 scripts/check-api-convergence.py
      - name: Check framework interface strings stay in the table
        run: python3 scripts/audit-framework-strings.py
      - name: Check packaging dependency boundary
        run: python3 scripts/check-package-boundary.py
      - name: Self-test repository gate scripts
        run: python3 -m unittest discover -s scripts/tests -v

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Full DWARF plus incremental caches grew the ubuntu target dir to ~91 GiB
    # against ~86 GiB free, so the job died with ENOSPC partway through. A
    # one-shot CI build never reuses incremental state, and line tables keep
    # panic locations and backtraces: the same run then needs ~43 GiB.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # libvulkan1 + mesa-vulkan-drivers give lavapipe: the runner has no GPU,
      # and the offscreen pixel tests need an adapter to execute.
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libvulkan1 mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check minimal feature set
        run: cargo check -p nana-ui --lib --no-default-features --locked
      - name: Check isolated component families
        if: runner.os == 'Linux'
        run: python3 scripts/check-component-features.py
      - name: Check Gallery package boundary
        run: cargo check -p component-gallery --bin component-gallery --locked
      - name: Run default-feature tests
        run: cargo test --workspace --all-targets --locked
      # Issue #242: measured output work, never a prerecorded zero fixture.
      # Linux has lavapipe, macOS Metal and Windows the hosted GPU/WARP path.
      - name: Exercise retained output and judge live GPU work
        shell: bash
        run: |
          cargo test -p nana-ui --lib --features gpu --locked output:: -- --test-threads=1
          cargo test -p nana-ui --test output_trace_owner --features gpu,wgpu-interop --locked -- --test-threads=1
          cargo test -p nana-gpu --features wgpu-interop --test controlled_device_loss --locked -- --test-threads=1
          cargo run -p nana-ui --features gpu --bin nana-output-benchmark --locked -- \
            --output target/performance/output-live.json
          for workload in static multi nested conversion slow recovery incompatible; do
            python3 perf/runners/nana/run.py --scenario "output-${workload}" \
              --from-report target/performance/output-live.json \
              --output "target/performance/output-gates/output-${workload}.json"
          done
          python3 perf/contract.py --evaluate-invariants target/performance/output-gates
          cargo run -p nana-ui --features gpu --bin nana-output-benchmark --locked -- \
            --transport-only --output target/performance/output-transports-live.json
          for workload in overlay-static overlay-changing overlay-multi overlay-slow web-static web-changing; do
            python3 perf/runners/nana/run.py --scenario "transport-${workload}" \
              --from-report target/performance/output-transports-live.json \
              --output "target/performance/transport-gates/transport-${workload}.json"
          done
          python3 perf/contract.py --evaluate-invariants target/performance/transport-gates
      - name: Check concrete Web bridge receipt and error classification contracts
        shell: bash
        run: node --test examples/web-output-bridge/*.test.cjs
      - name: Exercise and judge real Window output topology
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo run -p nana-ui --example presentation-output-probe --features hosted,bundled-fonts --locked -- \
            --output target/performance/output-window.json
          python3 perf/runners/nana/run.py --scenario output-direct \
            --from-report target/performance/output-window.json \
            --output target/performance/output-direct.json
          python3 perf/contract.py --evaluate-invariants target/performance/output-direct.json
      # Pure ABI/kernel-handle tests need Windows, but no SteamVR or Electron.
      # The ignored live SteamVR test stays a separate conformance requirement.
      - name: Check native reference ABI and temporary NT handle ownership
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p nana-ui --example openvr-output-probe --example web-output-producer \
            --features gpu,bundled-fonts,native-export,wgpu-interop --locked -- --test-threads=1
      - name: Exercise DX12 export and actual D3D11 native import
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 15
        env:
          NANA_REQUIRE_DX12_NATIVE_TESTS: "1"
        run: |
          set -euo pipefail
          mkdir -p target/performance
          cargo test -p nana-gpu --features native-export --test native_export --locked -- \
            --test-threads=1 --nocapture 2>&1 | tee target/performance/output-native-tests.log
          cargo run -p nana-ui --example window-output-probe --features hosted,bundled-fonts,native-export --locked \
            | tee target/performance/output-native-window.jsonl
          cargo run -p nana-ui --example window-output-probe --features hosted,bundled-fonts,native-export --locked -- \
            --perf-output target/performance/output-native-host.json
          python3 perf/runners/nana/run.py --scenario transport-native-host \
            --from-report target/performance/output-native-host.json \
            --output target/performance/output-native-host-gate.json
          python3 perf/contract.py --evaluate-invariants target/performance/output-native-host-gate.json
      - name: Save presentation conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: presentation-output-${{ matrix.os }}
          path: |
            target/performance/output-live.json
            target/performance/output-transports-live.json
            target/performance/transport-gates
            target/performance/output-gates
            target/performance/output-window.json
            target/performance/output-direct.json
            target/performance/output-native-tests.log
            target/performance/output-native-window.jsonl
            target/performance/output-native-host.json
            target/performance/output-native-host-gate.json
      # The Runtime suite again on typed contexts: a creation path that forgot
      # to install a component's type hook fails the test that needs it.
      - name: Run Runtime tests on typed contexts
        if: runner.os == 'Linux'
        env:
          NANA_TEST_TYPED_BUILTINS: "1"
        run: cargo test -p nana-ui-runtime --lib --locked
      # The product frame (`RuntimeDocument::flush`) under the per-pass guard:
      # every retained layout pass is checked against a full layout.
      - name: Run Scene tests under the layout guard
        if: runner.os == 'Linux'
        run: cargo test -p nana-ui-scene --lib --features nana-ui-runtime/layout-verify --locked
      # The headless Agent surface is gated behind non-default features, so the
      # default-feature run above compiles all of it out. Linux has lavapipe, so
      # the offscreen pixel tests genuinely execute there; elsewhere they skip
      # visibly through `offscreen::pixels_available`.
      - name: Run headless Agent tests
        run: cargo test -p nana-ui-devtools --features runtime-agent,nana-ui/components --all-targets --locked
      # Self-verifying real-window hosts: one event loop, shared device, close and
      # re-create. Windows runners have a desktop and the WARP adapter.
      - name: Run multi-window lifecycle hosts
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          lifecycle() { cargo run -p nana-ui --example "$1" --features hosted,bundled-fonts,wgpu-interop --locked -- "${@:2}"; }
          lifecycle window-service-lifecycle
          lifecycle embedded-window-lifecycle
          lifecycle embedded-window-lifecycle --probe-device-loss
          lifecycle embedded-window-lifecycle --probe-host-stop
          lifecycle theme-switch-probe
      # The Gallery *pixel* gate cannot run here: it compares exactly against a
      # baseline recorded by one GPU adapter, and no hosted runner matches a
      # committed adapter key. These tests cover the parts that are
      # adapter-independent -- the baseline store's verify/bless/stale logic,
      # that every compiled component still has a snapshot fixture, and the
      # Issue #101 semantic baseline: the same light/dark state matrix as
      # resolved style rather than pixels, which needs no adapter and would
      # otherwise be checked nowhere.
      - name: Run Gallery snapshot-gate tests
        run: cargo test -p component-gallery --bin ui-snapshots --features snapshots --locked
      # `nana-ui-dev` refuses to compile without `debug_assertions`, which
      # `[profile.dist]` turns off. A product crate that grows a dependency on
      # the dev watcher fails here instead of shipping one to users. `check`
      # rather than `build`: it evaluates the same cfg without paying fat LTO.
      - name: Check the dev hot-reload crate cannot reach a packaged build
        shell: bash
        run: |
          cargo check --profile dist -p component-gallery --locked
          if cargo check --profile dist -p nana-ui-dev --locked 2>/dev/null; then
            echo "nana-ui-dev compiled under the dist profile; its release guard is gone" >&2
            exit 1
          fi
      # The dev binary's headless branch is opt-in, so the default run above
      # compiles it out. Without this the `--stdio` / `--screenshot` path that
      # `docs/hot-reload.md` tells L3 authors to use could rot unnoticed.
      - name: Check the L3 dev entry's headless branch
        run: cargo check -p nana-ui-dev --example l3-dev-entry --features headless --locked
      - name: Check default-feature targets
        run: cargo check --workspace --all-targets --locked
      - name: Check legal feature combinations
        shell: bash
        run: |
          cargo check -p nana-ui --all-targets --all-features --locked
          # Issue #226: the pack mount without the hosted window stack.
          cargo check -p nana-ui --all-targets --features packaged-resources --locked
          cargo check -p component-gallery --all-targets --all-features --locked
          # `required-features` hides the dirty-frame benchmark from every
          # workspace-wide check, so without this line it can rot or be deleted
          # with CI still green. It is the Issue #33 / #89 migration baseline.
          cargo check -p nana-ui-scene --all-targets --features benchmark --locked
          # Issue #227: the diagnostics hot-path benchmark, same reason.
          cargo check -p nana-diagnostics --all-targets --features benchmark --locked
      - name: Check macOS WebView reference
        if: runner.os == 'macOS'
        working-directory: tools/css-parity-webview
        run: cargo check --all-targets --locked
      - name: Enforce workspace Clippy
        run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings
      - name: Enforce NanaUI and Gallery Clippy
        run: cargo clippy -p nana-ui -p component-gallery -p nana-diagnostics --all-targets --all-features --locked --no-deps -- -D warnings
      # Headroom left on the runner disk, so the next growth shows up here
      # before it becomes an ENOSPC in whichever step happens to be last.
      - name: Report disk use
        if: always() && runner.os == 'Linux'
        run: |
          df -h /
          du -sh target || true

  android-arm64-cross:
    # Check-only: a break in the Android ARM64 cross-compile is otherwise
    # invisible until someone builds the host by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Cross-check Android ARM64 crates
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/check-android-arm64.sh

  ohos-arm64-cross:
    # OHOS is a compile tier (docs/reference/ohos.md): `target_os` is `linux`,
    # so a new desktop-only Linux branch breaks it silently. No OHOS SDK here,
    # so the script checks the crates that build no C; `fetch` (ring) needs
    # OHOS_NDK_HOME and is not in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos
      - name: Cross-check OHOS ARM64 crates
        run: bash scripts/check-ohos-arm64.sh

  msrv:
    # Every manifest declares rust-version = "1.98"; the other jobs use the
    # stable toolchain, so without this job the declared minimum is untested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Check the workspace on the declared minimum toolchain
        run: cargo check --workspace --all-targets --locked

  runtime-work-invariants:
    # Issue #8 PR gate: named cargo tests plus --evaluate-invariants on Nana
    # fixture envelopes. Live release benches stay in runtime-performance.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Work-counter and virtualization invariants
        run: |
          # libtest is substring match; `|` is not a regex and `--exact` needs
          # the module-prefixed name. Unique function names are the filter.
          for name in \
            dirty_work_is_incremental_and_static_world_stays_idle \
            scheduled_ui_frames_are_zero_after_static_settle_and_nonzero_when_paint_stays_dirty \
            paint_only_style_change_does_not_schedule_subtree_layout \
            pointer_hover_and_press_are_runtime_owned_and_targeted \
            parking_or_removing_the_last_presence_node_returns_the_skip_path \
            transform_and_a11y_mutations_do_not_schedule_layout \
            accessibility_delta_seeds_from_moved_boxes_not_scheduled_layout \
            scrolling_publishes_the_moved_subtree_and_matches_a_full_projection \
            work_counters_are_queryable_after_drain_and_extract \
            scoped_layout_touches_only_the_change_closure_and_matches_full_recompute \
            scoped_layout_matches_full_recompute_across_container_shapes_and_edits \
            scoped_layout_contained_edit_does_not_scan_siblings_as_the_document_grows \
            scoped_layout_contained_edit_stays_flat_beside_a_parked_row \
            rewriting_a_list_with_its_own_values_does_no_work \
            an_unchanged_update_skips_projection_and_reproject_component_forces_it \
            putting_a_child_back_where_it_is_or_reparking_it_is_no_work \
            rewriting_an_assembled_composite_with_its_own_values_is_no_work \
            content_growth_under_a_child_moves_its_siblings \
            content_growth_under_a_child_moves_its_siblings_when_the_container_hugs \
            flipping_a_container_to_a_row_remeasures_children_that_depend_on_the_direction \
            a_display_contents_child_keeps_its_container_off_the_cached_plans \
            a_container_whose_own_text_grows_remeasures_itself \
            a_default_spelled_two_ways_keeps_the_plan_but_a_real_direction_change_retires_it \
            projecting_a_stack_does_not_rewrite_the_style_the_cascade_published \
            an_unset_flow_axis_is_a_column_but_not_a_row \
            stack_ignores_child_derived_spec_so_declaring_it_is_honest \
            the_child_spec_flag_reaches_every_alias_and_defaults_to_yes \
            scroll_view_with_forty_rows_dirties_forty_one_hit_targets \
            virtual_list_materializes_only_visible_items_and_reuses_overlap \
            virtual_table_materializes_a_bounded_grid_and_reuses_both_axes \
            virtual_tree_materializes_only_visible_rows_and_reuses_overlap_on_scroll_and_expand \
            inline_content::tests \
            issue199 \
            issue200 \
            issue201 \
            issue202 \
            issue204 \
            issue205 \
            issue211 \
            issue212 \
            issue213 \
            issue214 \
            issue255 \
            issue256 \
            issue257 \
            issue259 \
            issue260 \
            issue261 \
            issue262 \
            issue263 \
            issue264 \
            issue265 \
            issue266 \
            issue268 \
            issue269 \
            issue270
          do
            cargo test -p nana-ui-runtime --lib --locked "$name"
          done
          cargo test --locked -p nana-ui-scene --test inline_content
          # Dynamic Layout's contract and solver (Issues #208, #209, #210).
          cargo test -p nana-ui-core --lib --locked dynamic_layout
          # Issue #211 Gate D: the CJK line decision stays near linear, the
          # pretty beam within K·C per line, and a resize never reshapes.
          cargo test -p nana-text --locked --test line_decision_gate
          # Issue #89 keeps the Issue #33 head-layout sweep as the text
          # migration baseline; this asserts the 2k/4k/8k cells are still in it.
          cargo test -p nana-ui-scene --features benchmark --locked \
            --bin nana-dirty-frame-benchmark \
            the_migration_grid_still_spans_two_four_and_eight_thousand_nodes
          # Issue #95: retained text nodes. Paint / transform / opacity never
          # reach shaping or layout, a static frame does zero text work, and
          # every #33 head-dirty candidate is decided on revision alone.
          cargo test -p nana-ui-scene --locked --test retained_text_node
          # Layout Foundation: Sticky scroll keeps layout/text work at zero;
          # Rust/template/CSS authoring agrees on structured layout output.
          cargo test -p nana-ui-scene --locked --test issue200_sticky
          cargo test -p nana-ui-runtime --features view-macro --locked --test view_macro issue204
          # Issue #206: laid-out Text/Button/ListItem keep bounded live memory
          # per node at 1k and 10k, and equal nodes share one layout.
          cargo test -p nana-ui-runtime --locked --test node_memory
          # Issue #250: steady pointer moves allocate nothing on the routing
          # path, an uncaptured move costs one hit query and a captured one
          # none. Counted, so it holds on a loaded runner.
          cargo test -p nana-ui-runtime --all-features --locked --test input_alloc
          # Issue #270: a steady localized message update allocates the same at any size.
          cargo test -p nana-ui-runtime --all-features --locked --test i18n_alloc
          python3 scripts/validate-runtime-performance.py --self-test
          python3 perf/contract.py --self-test
          mkdir -p target/performance/issue8/invariants
          python3 perf/runners/nana/run.py --scenario text-table \
            --from-report perf/fixtures/nana-framework-text-table.json \
            --output target/performance/issue8/invariants/nana-text-table.json
          python3 perf/runners/nana/run.py --scenario virtual-list-10k \
            --from-report perf/fixtures/virtual-scales-only.json \
            --output target/performance/issue8/invariants/nana-virtual-list-10k.json
          python3 perf/runners/nana/run.py --scenario virtual-list-100k \
            --from-report perf/fixtures/virtual-scales-only.json \
            --output target/performance/issue8/invariants/nana-virtual-list-100k.json
          python3 perf/runners/nana/run.py --scenario virtual-tree-10k \
            --from-report perf/fixtures/virtual-tree-scales.json \
            --output target/performance/issue8/invariants/nana-virtual-tree-10k.json
          python3 perf/runners/nana/run.py --scenario virtual-tree-100k \
            --from-report perf/fixtures/virtual-tree-scales.json \
            --output target/performance/issue8/invariants/nana-virtual-tree-100k.json
          python3 perf/runners/nana/run.py --scenario static-tree-100 \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-static-tree-100.json
          python3 perf/runners/nana/run.py --scenario static-tree-1k \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-static-tree-1k.json
          python3 perf/runners/nana/run.py --scenario static-tree-5k \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-static-tree-5k.json
          python3 perf/runners/nana/run.py --scenario static-tree-10k \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-static-tree-10k.json
          python3 perf/runners/nana/run.py --scenario hover \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-hover.json
          python3 perf/runners/nana/run.py --scenario mutation-paint-only \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-mutation-paint-only.json
          python3 perf/runners/nana/run.py --scenario mutation-text \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-mutation-text.json
          python3 perf/runners/nana/run.py --scenario mutation-layout-style \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-mutation-layout-style.json
          python3 perf/runners/nana/run.py --scenario mutation-visibility \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-mutation-visibility.json
          python3 perf/runners/nana/run.py --scenario mutation-transform \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-mutation-transform.json
          python3 perf/runners/nana/run.py --scenario mutation-a11y \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-mutation-a11y.json
          python3 perf/runners/nana/run.py --scenario animation \
            --from-report perf/fixtures/nana-runtime-static-tree.json \
            --output target/performance/issue8/invariants/nana-animation.json
          python3 perf/runners/nana/run.py --scenario ime \
            --from-report perf/fixtures/nana-framework-catalog-workloads.json \
            --output target/performance/issue8/invariants/nana-ime.json
          python3 perf/runners/nana/run.py --scenario dock-workspace \
            --from-report perf/fixtures/nana-framework-catalog-workloads.json \
            --output target/performance/issue8/invariants/nana-dock-workspace.json
          python3 perf/runners/nana/run.py --scenario overlay \
            --from-report perf/fixtures/nana-framework-catalog-workloads.json \
            --output target/performance/issue8/invariants/nana-overlay.json
          python3 perf/runners/nana/run.py --scenario text-editor \
            --from-report perf/fixtures/nana-framework-catalog-workloads.json \
            --output target/performance/issue8/invariants/nana-text-editor.json
          python3 perf/runners/nana/run.py --scenario gpu-scene-ui \
            --from-report perf/fixtures/nana-gpu-scene-ui.json \
            --output target/performance/issue8/invariants/nana-gpu-scene-ui.json
          python3 perf/contract.py --evaluate-invariants target/performance/issue8/invariants
          # #98 / #99 retained-text gates, judged on reports recorded on real
          # hardware (the weekly macOS job runs them live). Not §8.1 rows, so a
          # directory of their own.
          mkdir -p target/performance/issue8/text
          for scenario in \
            gpu-scene-text-retained gpu-scene-text-paint-color \
            gpu-scene-text-compositor-opacity gpu-scene-text-compositor-transform \
            gpu-scene-text-compositor-slide gpu-scene-text-constraint-resize
          do
            python3 perf/runners/nana/run.py --scenario "$scenario" \
              --from-report "perf/fixtures/nana-${scenario}.json" \
              --output "target/performance/issue8/text/nana-${scenario}.json"
          done
          python3 perf/contract.py --evaluate-invariants target/performance/issue8/text

  # Issue #226 final-artifact validation: package the headless fixture with
  # freshly generated keys, launch the delivered artifact from a foreign
  # working directory, tamper with copies, and repackage against the
  # previous output (no-op rebuilds must be byte-identical). The Steam delta
  # fixture's numbers are uploaded for inspection.
  packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Test the pack format and the packager
        run: cargo test -p nana-package -p nana-packager --locked -- --nocapture
      - uses: actions/upload-artifact@v7
        with:
          name: issue226-delta-${{ matrix.os }}
          path: target/performance/issue226
      - name: Package, launch and tamper with the fixture
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/nana-package"
          rm -rf "$work" && mkdir -p "$work"
          cargo build -p nana-packager --locked
          packager=target/debug/nana-packager
          "$packager" keygen content --out "$work/content.key"
          "$packager" keygen publisher --out "$work/publisher.key" | tee "$work/publisher.txt"
          publisher=$(sed -n 's/.*: \(ed25519:.*\)/\1/p' "$work/publisher.txt")
          content=$(tr -d '\r\n' < "$work/content.key")
          echo "::add-mask::$content"
          echo "::add-mask::$(tr -d '\r\n' < "$work/publisher.key")"
          NANA_FIXTURE_PUBLISHER_KEY="$publisher" cargo build -p package-fixture --release --locked
          exe=target/release/package-fixture
          case "$RUNNER_OS" in
            Windows) exe="$exe.exe"; root="app/NanaPackageFixture" ;;
            macOS) root="app/Nana Package Fixture.app" ;;
            *) root="app/NanaPackageFixture" ;;
          esac
          package() {
            NANA_CONTENT_KEY_CONTENT_MAIN="$content" \
            NANA_PUBLISHER_SIGNING_KEY="$(tr -d '\r\n' < "$work/publisher.key")" \
              "$packager" package --config examples/package-fixture/nana-package.toml \
                --exe "$exe" --profile release --build-id "$GITHUB_RUN_NUMBER" \
                --cache "$work/cache" "$@"
          }
          package --out "$work/v1"
          NANA_CONTENT_KEY_CONTENT_MAIN="$content" "$packager" validate "$work/v1/$root" \
            --trust-key "$publisher" --run --tamper-suite --env "NANA_FIXTURE_CONTENT_KEY=$content" \
            --tamper-drop-env NANA_FIXTURE_CONTENT_KEY
          package --out "$work/v2" --baseline "$work/v1"
          packs=0
          while IFS= read -r -d '' pack; do
            cmp "$pack" "$work/v2/${pack#"$work/v1/"}"
            packs=$((packs + 1))
          done < <(find "$work/v1/app" -name '*.nrpack' -print0)
          [ "$packs" -eq 3 ]

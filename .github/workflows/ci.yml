name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Rebuild Vue SFC compatibility fixture
        working-directory: crates/nana-js-engine/fixtures/vue-sfc-compat
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist
      - name: Check minimal feature set
        run: cargo check -p nana-ui --lib --no-default-features --locked
      - name: Check Gallery package boundary
        run: cargo check -p component-gallery --bin component-gallery --locked
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Check all targets
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

[workspace]
# Nested workspace: wry/tao must not enter the NanaUI lockfile.

[package]
name = "nana-css-parity-webview"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "macOS WKWebView / wry reference for nana-css-parity (not a NanaUI product crate)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "css-parity-webview"
path = "src/bin/css_parity_webview.rs"

[dependencies]
nana-css-parity = { path = "../css-parity" }
# macOS WKWebView / wry reference only — never enable from nana-ui product crates.
#
# Dependabot flags glib 0.18.5 here (GHSA-wrw7-89jp-8q8g, medium: unsoundness in
# `VariantStrIter` causing NULL derefs). It cannot be lifted from this manifest:
# glib arrives only on tao's Linux/GTK path, and the gtk-rs 0.18 line that tao
# pins has no glib 0.20 release. Bumping wry to 0.56.1 was tried and still
# resolves glib 0.18.5. This tool is a macOS reference binary outside the
# workspace, never links from a product crate, and never calls `VariantStrIter`.
# Revisit when tao moves to gtk-rs with glib >= 0.20; do not churn the lockfile
# chasing it in the meantime.
wry = { version = "=0.55.1", default-features = true }
tao = { version = "0.31", default-features = true }

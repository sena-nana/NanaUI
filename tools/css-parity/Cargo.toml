[package]
name = "nana-css-parity"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "CSS layout parity fixtures: LayoutStyle measure vs fixture expected boxes"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "nana_css_parity"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "css-parity"
path = "src/bin/css_parity.rs"
test = false

[dependencies]
# Same font as the shipped measure path, so text boxes match the fixtures.
nana-ui-core = { workspace = true, features = ["bundled-font-regular"] }
nana-ui-css.workspace = true
nana-ui-runtime = { workspace = true, features = ["icu"] }
# The process-wide `nana-text` engine (NanaTextShaper) lives in `nana-ui`.
nana-ui = { path = "../../crates/nana-ui", default-features = false, features = ["icu"] }
serde = { workspace = true }
serde_json = { workspace = true }

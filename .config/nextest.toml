[profile.default]
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

[profile.ci]
slow-timeout = { period = "20s", terminate-after = 2 }
fail-fast = false

[test-groups]
gpu-serial = { max-threads = 1 }
os-global = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(nana-gpu) | package(nana-frame-exchange) | package(nana-ui) | package(nana-ui-devtools) | package(nana-wgpu-fork-tests) | package(runtime-host-fixture) | package(nana-mobile-probe) | binary(ui-snapshots)'
test-group = 'gpu-serial'

[[profile.default.overrides]]
filter = 'package(nana-window) | package(nana-diagnostics) | package(nana-ui-platform)'
test-group = 'os-global'

[[profile.default.overrides]]
filter = 'package(nana-packager)'
slow-timeout = { period = "30s", terminate-after = 2 }
